<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 관리자</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 24px; }
  .admin-card { display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; text-decoration: none; color: inherit; transition: border-color 0.15s ease; }
  .admin-card:hover { border-color: var(--ink); }
  .admin-card .ico { font-size: 22px; margin-bottom: 10px; display: block; }
  .admin-card .ttl { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
  .admin-card p { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg class="otter-mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="2.4" fill="currentColor"/><circle cx="17" cy="7" r="2.4" fill="currentColor"/><ellipse cx="12" cy="13.5" rx="8" ry="7" fill="currentColor"/><circle cx="9" cy="12.5" r="1.1" fill="var(--paper)"/><circle cx="15" cy="12.5" r="1.1" fill="var(--paper)"/><ellipse cx="12" cy="16" rx="1.6" ry="1.1" fill="var(--paper)"/></svg> 관리자</h1>
    <button class="logout" id="logoutBtn">관리자 로그아웃</button>
  </header>

  <div class="admin-grid">
    <a class="admin-card" href="/admin-points.html">
      <span class="ico">💰</span>
      <div class="ttl">포인트 충전 승인</div>
      <p>계좌이체로 들어온 포인트 충전 신청을 확인하고 승인·거절해요.</p>
    </a>
    <a class="admin-card" href="/admin-users.html">
      <span class="ico">👥</span>
      <div class="ttl">회원관리</div>
      <p>회원 목록, 포인트 잔액, 계정 상태를 관리해요.</p>
    </a>
    <a class="admin-card" href="/admin-orders.html">
      <span class="ico">📊</span>
      <div class="ttl">생성 원가</div>
      <p>주문별 리포트 생성 비용과 마진을 확인해요.</p>
    </a>
    <a class="admin-card" href="/admin-banners.html">
      <span class="ico">🖼️</span>
      <div class="ttl">배너 편집</div>
      <p>메인 페이지 배너의 이미지·문구·순서를 관리해요.</p>
    </a>
    <a class="admin-card" href="/admin-leads.html">
      <span class="ico">💬</span>
      <div class="ttl">상담 접수</div>
      <p>카카오톡 상담 랜딩페이지로 들어온 접수 목록을 확인해요.</p>
    </a>
  </div>
</div>

<script>
  async function checkAdmin() {
    const res = await fetch('/api/admin/me');
    const data = await res.json();
    if (!data.isAdmin) { location.href = '/admin-login.html'; return false; }
    return true;
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method: 'POST' });
    location.href = '/admin-login.html';
  });

  checkAdmin();
</script>
</body>
</html>
