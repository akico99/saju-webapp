<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 비밀번호 찾기</title>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/login.html">←</a>
    <div class="ttl">비밀번호 찾기</div>
  </header>
  <main>
    <h1>비밀번호를 잊으셨나요</h1>
    <p class="lead">가입할 때 쓰신 이메일을 입력하시면, 재설정 링크를 보내드려요.</p>

    <div id="errorBox" class="error-box hidden"></div>
    <div id="successBox" class="hidden" style="background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;margin-bottom:16px;font-size:13.5px;line-height:1.6;color:var(--ink);"></div>

    <form id="forgotForm">
      <div class="field">
        <label>이메일</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <button type="submit" id="submitBtn">재설정 링크 보내기</button>
    </form>
    <p class="switch-link"><a href="/login.html">로그인으로 돌아가기</a></p>
  </main>
</div>

<script>
  const form = document.getElementById('forgotForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');
    successBox.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = '보내는 중...';

    const fd = new FormData(form);
    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: fd.get('email') })
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || '요청 실패';
        errorBox.classList.remove('hidden');
      } else {
        successBox.textContent = data.message;
        successBox.classList.remove('hidden');
        form.reset();
      }
    } catch (err) {
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '재설정 링크 보내기';
    }
  });
</script>
</body>
</html>
