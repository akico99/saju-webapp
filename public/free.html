<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-THWHBPH5WR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-THWHBPH5WR');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 무료 미니 리딩</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/reading-ui.css">
<link rel="stylesheet" href="/editorial-refresh.css">
<link rel="stylesheet" href="/balance-experience.css">
<link rel="stylesheet" href="/balance-book.css">
<link rel="stylesheet" href="/fortune-result.css">
<script src="/analysis-loader.js"></script>
<script src="/balance-book.js" defer></script>
<style>
  /* 무료 미니 리딩 3종(귀인·오행·매력)이 이 한 페이지를 쓴다. kind별 차이는 JS 설정표에 있다. */
  .preview-teaser { margin: 0 0 20px; padding-left: 18px; font-size: 13.5px; line-height: 2; color: var(--ink); }
  .preview-teaser li::marker { color: var(--accent); }

  /* #result(.fr-hero/.card)는 오행 밸런스 책이 쓴다(balance-experience.css). 귀인·매력은
     #frResult에 fortune-result.css의 표지·항목 구조로 그린다. */
  .fr-hero { background: var(--ink); color: #fff; border: none; }
  .fr-hero .eyebrow { font-size: 11px; opacity: .65; margin-bottom: 6px; }
  .fr-hero h2 { font-family: var(--font-serif); font-size: 21px; line-height: 1.4; margin: 0 0 10px; letter-spacing: -.01em; word-break: keep-all; }
  .fr-hero p { margin: 0; font-size: 13.5px; line-height: 1.8; opacity: .9; word-break: keep-all; }

  .fr-bars { display: flex; flex-direction: column; gap: 9px; }
  .fr-bar { display: grid; grid-template-columns: 62px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; }
  .fr-bar .lbl b { display: block; font-size: 13.5px; }
  .fr-bar .lbl small { color: var(--muted); font-size: 11px; }
  .fr-bar .track { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .fr-bar .track i { display: block; height: 100%; border-radius: 6px; transition: width .5s; }
  .fr-bar .n { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .fr-bar.lack .lbl b { color: #8a4a34; }
  .fr-grade { display: inline-block; margin-left: 4px; font-size: 10.5px; color: var(--muted); font-weight: 600; }

  .fr-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .fr-two > div { padding: 12px; border-radius: 12px; background: var(--surface-2); font-size: 12.5px; line-height: 1.7; word-break: keep-all; }
  .fr-two b { display: block; margin-bottom: 4px; font-size: 12px; }
  .fr-two .light b { color: var(--success); }
  .fr-two .shadow b { color: var(--danger); }

  .tf-upsell { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; padding: 14px 18px; margin-top: 14px; background: var(--accent-grad); border-radius: var(--radius-btn); box-shadow: var(--accent-glow); text-decoration: none; color: var(--accent); }
  .tf-upsell .name { font-size: 14.5px; font-weight: 800; word-break: keep-all; }
  .tf-upsell .price { font-size: 14px; font-weight: 800; flex-shrink: 0; }
  .tf-topic-lead { font-size: 13px; line-height: 1.7; color: var(--muted); margin: 0 0 10px; word-break: keep-all; }

  .lg-folded { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); font-size: 12.5px; color: var(--muted); }
  .lg-folded button { flex: 0 0 auto; width: auto; margin: 0; padding: 7px 12px; font-size: 12px; font-weight: 700; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-btn); box-shadow: none; cursor: pointer; font-family: inherit; min-height: 0; }
</style>
</head>
<body class="reading-page editorial-result-page">
<div class="app">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl" id="pageTitle">무료 미니 리딩</div>
      <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
    <div id="introBox">
      <h1 id="introTitle"></h1>
      <p class="lead" id="introLead" style="margin-bottom:14px;"></p>
      <ul class="preview-teaser" id="introTeaser"></ul>
    </div>

    <form id="frForm">
      <div class="field-row">
        <div class="field">
          <label>성별</label>
          <select name="gender">
            <option value="남">남자</option>
            <option value="여">여자</option>
          </select>
        </div>
        <div class="field">
          <label>양력/음력</label>
          <select name="calendar">
            <option value="양력">양력</option>
            <option value="음력">음력</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>생년월일</label>
        <div class="date-inputs">
          <input type="number" name="year" placeholder="년" min="1900" max="2100" required>
          <input type="number" name="month" placeholder="월" min="1" max="12" required>
          <input type="number" name="day" placeholder="일" min="1" max="31" required>
        </div>
      </div>
      <div class="field">
        <label>태어난 시각 <span style="font-weight:400;color:var(--muted)">(알면 더 정확해요)</span></label>
        <div class="date-inputs">
          <input type="number" name="hour" placeholder="시(0-23)" min="0" max="23">
          <input type="number" name="minute" placeholder="분" min="0" max="59">
        </div>
        <label class="checkbox-field" style="margin-top:8px;"><input type="checkbox" name="hourUnknown"> 시각 모름</label>
      </div>
      <button type="submit" id="submitBtn">무료로 보기</button>
    </form>

    <div id="errorBox" class="error-box hidden"></div>

    <div class="lg-folded hidden" id="folded" style="margin:0 0 16px;">
      <span id="foldedText"></span>
      <button type="button" id="unfoldBtn">다시 입력</button>
    </div>

    <div id="frResult" class="fortune-result hidden">
      <section class="fr-cover">
        <p class="fr-eyebrow" id="frEyebrow"></p>
        <h2 class="fr-verdict" id="frHeadline"></h2>
        <p class="fr-lead-inv" id="frLead"></p>
        <div class="fr-pillars" id="frPillars"></div>
      </section>
      <div id="frBody"></div>
      <a class="fr-next" id="frUpLink" href="#">
        <span class="fr-next-kicker">다음 장</span>
        <span class="fr-next-lead" id="frUpLead"></span>
        <span class="fr-next-btn"><span id="frUpName"></span><span class="price" id="frUpPrice"></span></span>
      </a>
      <div class="fr-others"><p>다른 무료 리딩</p><div id="frOthers"></div></div>
    </div>

    <div id="result" class="hidden">
      <div id="balanceBook" class="balance-book" hidden></div>
      <div class="card fr-hero">
        <div class="eyebrow" id="rEyebrow"></div>
        <h2 id="rHeadline"></h2>
        <p id="rLead"></p>
        <div class="balance-cover-facts" id="balanceCoverFacts" aria-label="오행 분석 핵심"></div>
      </div>

      <div class="card" id="rBody"></div>

      <div class="card">
        <div class="balance-paid-preview">
          <span class="balance-section-no">다음 장 / 내 사주 첫 풀이</span>
          <h3>다섯 기운을 알았다면,<br>이제 나를 읽을 차례</h3>
          <ul>
            <li>이 기운이 성격과 기질에 드러나는 방식</li>
            <li>내 사주의 큰 구조와 한 줄 총평</li>
            <li>지금 대운과 앞으로 3년의 흐름</li>
          </ul>
        </div>
        <p class="tf-topic-lead" id="upLead"></p>
        <a class="tf-upsell" id="upLink" href="#">
          <span class="name" id="upName"></span>
          <span class="price" id="upPrice"></span>
        </a>
      </div>

      <div class="card">
        <h3>다른 무료 리딩도 보기</h3>
        <div class="fr-others" id="others"></div>
      </div>
    </div>
  </main>
</div>

<script>
  // kind별 소개 문구 — 결과는 서버(freeReadings.js)가 만든다. 여기는 폼 위 예고와 그리기만.
  const KINDS = {
    noble: {
      title: '사주 속 귀인', intro: '내게 찾아올 귀인은 어디에 있을까?',
      lead: '태어난 네 기둥 안에 이름 붙은 귀인이 있는지, 있다면 어느 관계·어느 시기의 인연인지 알려드려요.',
      teaser: ['천을귀인·문창귀인 같은 길신이 내 사주에 있는지', '어느 자리(조상·부모·배우자·자녀)에 놓였는지', '그 인연을 살리는 한 가지 행동'],
      eyebrow: '사주 속 귀인', steps: ['네 기둥 세우기', '길신·신살 대조', '궁위 읽기']
    },
    balance: {
      title: '내 오행 밸런스', intro: '내 기운은 어디로 기울어 있을까?',
      lead: '여덟 글자를 다섯 기운(목·화·토·금·수)으로 나눠 무엇이 많고 무엇이 비었는지 막대로 보여드려요.',
      teaser: ['다섯 기운의 개수와 강약', '가장 센 기운의 강점과 그림자', '비어 있는 기운이 삶에서 남기는 자리'],
      eyebrow: '내 오행 밸런스', steps: ['여덟 글자 뽑기', '오행 세기', '균형 판정']
    },
    charm: {
      title: '타고난 매력', intro: '나는 어떤 사람으로 보일까?',
      lead: '일간이 정하는 기본 인상에, 도화·장성·반안 같은 신살이 어떤 색을 더하는지 알려드려요.',
      teaser: ['일간 10종 중 내 바탕이 주는 인상', '매력으로 읽는 신살이 있는지, 어느 자리인지', '그 매력의 그림자와 쓰는 법'],
      eyebrow: '타고난 매력', steps: ['일간 확인', '신살 대조', '매력 유형 정리']
    }
  };
  const kind = new URLSearchParams(location.search).get('kind');
  const cfg = KINDS[kind];
  if (!cfg) location.replace('/free.html?kind=balance');
  if (kind === 'balance') document.body.classList.add('balance-experience');

  document.title = `사주보는 수달 — ${cfg.title} (무료)`;
  document.getElementById('pageTitle').textContent = cfg.title + ' · 무료';
  document.getElementById('introTitle').textContent = cfg.intro;
  document.getElementById('introLead').textContent = cfg.lead;
  document.getElementById('introTeaser').innerHTML = cfg.teaser.map((t) => `<li>${t}</li>`).join('');
  const othersHtml = Object.entries(KINDS).filter(([k]) => k !== kind)
    .map(([k, c]) => `<a href="/free.html?kind=${k}">${c.title}</a>`).join('') +
    `<a href="/today-preview.html">오늘의 운세</a><a href="/life-graph.html">인생 그래프</a>`;
  document.getElementById('others').innerHTML = othersHtml;
  document.getElementById('frOthers').innerHTML = othersHtml;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // 항목 하나 — 기둥 태그, 제목, 어디서·언제, 본문, 실천 또는 그림자
  function entry({ tag, tagSub, soft, title, where, core, tip, shadow }) {
    const item = el('article', 'fr-entry');
    const t = el('span', 'fr-where-tag' + (soft ? ' soft' : ''), tag);
    if (tagSub) t.append(' ', el('small', null, tagSub));
    item.append(t, el('h4', null, title));
    if (where) item.appendChild(el('p', 'where', where));
    item.appendChild(el('p', 'core', core));
    if (tip) item.appendChild(el('p', 'tip', tip));
    if (shadow) item.appendChild(el('p', 'shadow', shadow));
    return item;
  }
  function renderPillars(r, onKeys) {
    const box = document.getElementById('frPillars');
    box.replaceChildren();
    const list = r.pillars || [];
    box.classList.toggle('three', list.length === 3);
    list.forEach((p) => {
      const d = el('div', onKeys.has(p.key) ? 'on' : '');
      d.append(el('small', null, p.ko), el('b', null, p.hanja), el('span', null, p.ganzi));
      box.appendChild(d);
    });
  }
  function renderNoble(r, body) {
    renderPillars(r, new Set(r.found.map((f) => f.pillar)));
    if (!r.found.length) {
      body.appendChild(el('div', 'fr-empty', '이름 붙은 귀인은 없지만, 이 사주가 사람을 어떻게 만나고 어디서 도움을 받는지는 십신 구조로 따로 볼 수 있어요. 귀인은 대운·세운으로 들어오는 해가 있어서, 어느 해에 오는지는 흐름에서 보입니다.'));
    }
    r.found.forEach((f) => body.appendChild(entry({
      tag: f.pillarKo, tagSub: f.ganzi, title: f.title,
      where: `${f.palace.who} · ${f.palace.when} — ${f.palace.how}`, core: f.core, tip: f.tip
    })));
    if (r.note) body.appendChild(el('p', 'fr-note', r.note));
  }
  function renderBalance(r, body) {
    window.BalanceBook.render(r, document.getElementById('balanceBook'));
  }

  function renderCharm(r, body) {
    renderPillars(r, new Set(r.found.map((f) => f.pillar)));
    body.appendChild(entry({ tag: '일간', tagSub: r.base.ilgan, soft: true, title: '바탕이 주는 인상', core: r.base.text }));
    r.found.forEach((f) => body.appendChild(entry({
      tag: f.pillarKo, tagSub: f.ganzi, title: f.title,
      where: `${f.palace.how} 쪽에서 특히 드러나요`, core: f.core, shadow: f.shadow
    })));
    if (r.note) body.appendChild(el('p', 'fr-note', r.note));
  }
  const RENDER = { noble: renderNoble, balance: renderBalance, charm: renderCharm };

  function render(r) {
    if (kind !== 'balance') {
      document.getElementById('frEyebrow').textContent = cfg.eyebrow + ' · 무료';
      document.getElementById('frHeadline').textContent = r.headline;
      document.getElementById('frLead').textContent = r.lead;
      const body = document.getElementById('frBody'); body.replaceChildren();
      RENDER[kind](r, body);
      document.getElementById('frUpLead').textContent = r.upsell.lead;
      document.getElementById('frUpName').textContent = r.upsell.name + ' 보기';
      document.getElementById('frUpPrice').textContent = r.upsell.price;
      document.getElementById('frUpLink').href = r.upsell.href;
      document.getElementById('frResult').classList.remove('hidden');
      return;
    }
    document.getElementById('rEyebrow').textContent = cfg.eyebrow;
    document.getElementById('rHeadline').textContent = r.headline;
    document.getElementById('rLead').textContent = r.lead;
    const body = document.getElementById('rBody'); body.replaceChildren();
    RENDER[kind](r, body);
    document.getElementById('upLead').textContent = '여기까지 무료로 확인했어요. 숫자 너머에서, 이 기운이 성격과 지금의 흐름에 어떻게 이어지는지 궁금하다면?';
    document.getElementById('upName').textContent = r.upsell.name + ' 보기';
    document.getElementById('upPrice').textContent = r.upsell.price;
    document.getElementById('upLink').href = r.upsell.href;
    document.getElementById('result').classList.remove('hidden');
  }
  document.getElementById('unfoldBtn').addEventListener('click', () => {
    document.getElementById('folded').classList.add('hidden');
    document.getElementById('introBox').classList.remove('hidden');
    document.getElementById('frForm').classList.remove('hidden');
    document.getElementById('frForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('frForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.add('hidden');
    const fd = new FormData(e.target);
    const body = Object.fromEntries(fd.entries());
    body.hourUnknown = fd.get('hourUnknown') === 'on';
    try {
      const request = fetch('/api/free/' + kind, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(async (res) => ({ res, data: await res.json() }));
      const { res, data } = await AnalysisLoader.run(cfg.steps, request);
      if (!res.ok) { errorBox.textContent = data.error || '계산 실패'; errorBox.classList.remove('hidden'); return; }
      render(data.reading);
      document.getElementById('introBox').classList.add('hidden');
      // 결과가 나오면 폼은 접는다 — 한 줄 요약과 "다시 입력"만 남긴다.
      const cal = body.calendar === '음력' ? '음력' : '양력';
      const time = body.hourUnknown || body.hour === '' ? '시각 모름' : `${body.hour}시 ${body.minute || 0}분`;
      document.getElementById('foldedText').textContent = [`${cal} ${body.year}.${body.month}.${body.day}`, time, body.gender].filter(Boolean).join(' · ');
      e.target.classList.add('hidden');
      document.getElementById('folded').classList.remove('hidden');
      document.getElementById(kind === 'balance' ? 'result' : 'frResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
    }
  });
</script>
<script src="/form-enhance.js"></script>
</body>
</html>
