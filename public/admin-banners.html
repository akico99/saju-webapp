<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주보는 수달 — 배너 이미지 위치 조정</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* 실제 메인 페이지 배너(.banner-slide, theme.css)와 픽셀 단위로 정확히 같아야
     슬라이더로 옮긴 위치가 실제 사이트에서도 똑같이 보인다. .wrap(데스크톱 900px, 좌우
     패딩 있음)에 넣으면 폭이 달라져서 크롭이 다르게 보이므로, 이 페이지는 store 계열
     페이지와 동일한 .app(모바일 480px, 패딩 없음) 컨테이너를 그대로 쓴다 — .banner-slide가
     그 안에서 padding 없이 바로 자식으로 붙어야 실제 폭(.app 전체 폭)과 일치한다. */
  .app { padding-bottom: 30px; }
  .banner-row { margin-bottom: 28px; }
  .banner-row h3 { font-size: 13px; font-weight: 800; margin: 0 0 10px; color: var(--muted); padding: 0 20px; }
  .pos-controls { padding: 0 20px; margin-top: 10px; }
  .pos-controls label { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .pos-controls input[type="range"] { flex: 1; }
  .pos-controls .val { width: 40px; text-align: right; font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/admin.html">←</a>
    <div class="ttl">배너 이미지 위치 조정</div>
  </header>
  <p class="lead" style="padding:16px 20px 0;margin-bottom:0;">사진이 카드 틀에 맞춰 잘리는 위치를 슬라이더로 옮길 수 있어요. 아래 미리보기는 실제 메인 페이지 배너와 폭·높이가 완전히 동일합니다.</p>

  <div id="rows"></div>
  <div style="padding:0 20px;">
    <button type="button" class="primary" id="saveAllBtn">전체 저장</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  const SLIDE_LABELS = {
    1: '1번 — 오늘의 나 총평', 2: '2번 — 애정운', 3: '3번 — 궁합',
    4: '4번 — 재물운', 5: '5번 — 직업·적성운', 6: '6번 — 평생사주 100p'
  };

  async function checkAdmin() {
    const res = await fetch('/api/admin/me');
    const data = await res.json();
    if (!data.isAdmin) { location.href = '/admin-login.html'; return false; }
    return true;
  }

  function parsePos(str) {
    const m = /^(\d{1,3})% (\d{1,3})%$/.exec(str || '50% 50%');
    return m ? { x: Number(m[1]), y: Number(m[2]) } : { x: 50, y: 50 };
  }

  function buildRow(id, posStr) {
    const { x, y } = parsePos(posStr);
    const row = document.createElement('div');
    row.className = 'banner-row';
    row.dataset.slide = id;
    row.innerHTML = `
      <h3>${SLIDE_LABELS[id] || (id + '번')}</h3>
      <div class="banner-slide"><img src="/banners/${id}.png" alt="" style="object-position:${x}% ${y}%;"></div>
      <div class="pos-controls">
        <label>가로 위치 <input type="range" min="0" max="100" value="${x}" data-axis="x"> <span class="val">${x}%</span></label>
        <label>세로 위치 <input type="range" min="0" max="100" value="${y}" data-axis="y"> <span class="val">${y}%</span></label>
      </div>
    `;
    const img = row.querySelector('img');
    row.querySelectorAll('input[type="range"]').forEach((input) => {
      input.addEventListener('input', () => {
        const xVal = row.querySelector('input[data-axis="x"]').value;
        const yVal = row.querySelector('input[data-axis="y"]').value;
        img.style.objectPosition = `${xVal}% ${yVal}%`;
        input.nextElementSibling.textContent = `${input.value}%`;
      });
    });
    return row;
  }

  async function load() {
    const res = await fetch('/api/banners');
    const data = await res.json();
    const container = document.getElementById('rows');
    container.innerHTML = '';
    Object.keys(data.positions).forEach((id) => {
      container.appendChild(buildRow(id, data.positions[id]));
    });
  }

  document.getElementById('saveAllBtn').addEventListener('click', async () => {
    const positions = {};
    document.querySelectorAll('.banner-row').forEach((row) => {
      const x = row.querySelector('input[data-axis="x"]').value;
      const y = row.querySelector('input[data-axis="y"]').value;
      positions[row.dataset.slide] = `${x}% ${y}%`;
    });
    const res = await fetch('/api/admin/banners', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ positions })
    });
    if (!res.ok) { showToast('저장 실패'); return; }
    showToast('저장 완료 — 메인 페이지에 바로 반영돼요.');
  });

  (async () => {
    if (!(await checkAdmin())) return;
    load();
  })();
</script>
</body>
</html>
