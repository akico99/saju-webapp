<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 배너 편집</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* 실제 메인 페이지 배너(.banner-slide, theme.css)와 픽셀 단위로 정확히 같아야
     슬라이더로 옮긴 위치가 실제 사이트에서도 똑같이 보인다. .wrap(데스크톱 900px, 좌우
     패딩 있음)에 넣으면 폭이 달라져서 크롭이 다르게 보이므로, 이 페이지는 store 계열
     페이지와 동일한 .app(모바일 480px, 패딩 없음) 컨테이너를 그대로 쓴다 — .banner-slide가
     그 안에서 padding 없이 바로 자식으로 붙어야 실제 폭(.app 전체 폭)과 일치한다. */
  .app { padding-bottom: 30px; }
  .banner-row { margin-bottom: 32px; }
  .banner-row-head { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; margin-bottom: 10px; }
  .banner-row-head h3 { font-size: 13px; font-weight: 800; margin: 0; color: var(--muted); }
  .remove-btn { font-size: 11.5px; color: var(--danger); background: none; border: 1px solid var(--danger-soft); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
  .banner-row .banner-slide { pointer-events: none; }
  .banner-row .banner-slide img { background: var(--surface-2); }
  .edit-panel { padding: 0 20px; margin-top: 12px; }
  .edit-panel .field { margin-bottom: 10px; }
  .edit-panel label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .edit-panel input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .upload-row { display: flex; align-items: center; gap: 10px; }
  .upload-btn {
    font-size: 12px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-family: inherit;
  }
  .upload-status { font-size: 11.5px; color: var(--muted); }
  .pos-controls { margin-top: 6px; }
  .pos-controls label { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .pos-controls input[type="range"] { flex: 1; }
  .pos-controls .val { width: 40px; text-align: right; font-weight: 700; color: var(--ink); }
  .align-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .align-row button {
    flex: 1; padding: 8px 4px; font-size: 11.5px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .align-row button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .align-group-ttl { font-size: 11px; color: var(--muted-2); margin: 10px 0 4px; }
  .add-btn {
    width: calc(100% - 40px); margin: 0 20px 20px; padding: 13px; border-radius: var(--radius-btn);
    border: 1.5px dashed var(--line); background: none; color: var(--muted); font-weight: 700; font-size: 13.5px;
    cursor: pointer; font-family: inherit;
  }
  .add-btn:hover { border-color: var(--ink); color: var(--ink); }

  /* ---------- 텍스트 블록 편집 ----------
     배너에 올릴 글을 정해진 칸에 끼워넣는 대신, 블록을 원하는 만큼 넣고 순서를 바꾼다. */
  .blocks { display: flex; flex-direction: column; gap: 8px; }
  .block {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface);
  }
  .block-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .block-type { flex: 1; display: flex; gap: 4px; }
  .block-type button {
    flex: 1; padding: 6px 2px; font-size: 11px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--paper); color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .block-type button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .block-move { display: flex; gap: 4px; }
  .block-move button, .block-del {
    width: 28px; height: 28px; padding: 0; font-size: 13px; line-height: 1; border: 1px solid var(--line);
    border-radius: 7px; background: var(--paper); color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .block-del { color: var(--danger); border-color: var(--danger-soft); }
  .block textarea {
    width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 40px; line-height: 1.5;
  }
  .block-scale { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .block-scale input[type="range"] { flex: 1; }
  .block-scale .val { width: 42px; text-align: right; font-weight: 700; color: var(--ink); }
  .block-colors { display: flex; gap: 12px; margin-top: 8px; }
  .color-ctl { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .color-ctl input[type="color"] {
    width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
    background: none; cursor: pointer;
  }
  .color-ctl .reset {
    font-size: 10.5px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .color-ctl .reset.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .block-add-row { display: flex; gap: 6px; margin-top: 8px; }
  .block-add-row button {
    flex: 1; padding: 9px 4px; font-size: 11.5px; border: 1.5px dashed var(--line); border-radius: 8px;
    background: none; color: var(--muted); cursor: pointer; font-family: inherit; font-weight: 700;
  }
  .block-add-row button:hover { border-color: var(--ink); color: var(--ink); }
  .blocks-empty { font-size: 11.5px; color: var(--muted-2); padding: 10px 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/admin.html">←</a>
    <div class="ttl">배너 편집</div>
      <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <p class="lead" style="padding:16px 20px 0;margin-bottom:0;">
    메인 페이지 배너를 자유롭게 추가·삭제하고, 이미지·문구·위치·크기를 조정할 수 있어요.
    문구는 블록 단위라 원하는 만큼 넣고 순서를 바꿀 수 있고, 버튼도 넣지 않아도 됩니다.
    아래 미리보기는 실제 메인 페이지 배너와 폭·높이가 완전히 동일합니다.
  </p>

  <div id="rows"></div>
  <button type="button" class="add-btn" id="addBtn">+ 배너 추가</button>
  <div style="padding:0 20px;">
    <button type="button" class="btn-primary" id="saveAllBtn">전체 저장</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/banner-slider.js"></script>
<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  const H_ALIGNS = [['left', '왼쪽'], ['center', '가운데'], ['right', '오른쪽']];
  const V_ALIGNS = [['top', '위'], ['center', '가운데'], ['bottom', '아래']];
  const BLOCK_TYPES = [['label', '작은 라벨'], ['title', '큰 제목'], ['body', '본문'], ['button', '버튼']];
  const OVERLAYS = [['none', '없음'], ['weak', '약하게'], ['strong', '진하게']];

  async function checkAdmin() {
    const res = await fetch('/api/admin/me');
    const data = await res.json();
    if (!data.isAdmin) { location.href = '/admin-login.html'; return false; }
    return true;
  }

  /* 미리보기는 실제 배너와 같은 그리기 코드(banner-slider.js)를 쓴다 — 여기서 따로 그리면
     실제 화면과 조금씩 어긋나고, 그 차이는 저장하고 메인에 가봐야 드러난다. */
  function applyPreview(row) {
    const fresh = window.BannerSlider.buildSlide(readRow(row));
    fresh.classList.add('banner-slide');
    row.querySelector('.banner-slide').replaceWith(fresh);
  }

  function readBlocks(row) {
    return Array.from(row.querySelectorAll('.block')).map((b) => ({
      type: b.dataset.type,
      text: b.querySelector('textarea').value,
      scale: Number(b.dataset.scale) || 1,
      color: b.dataset.color || '',
      bgColor: b.dataset.bgColor || ''
    }));
  }

  function readRow(row) {
    return {
      id: row.dataset.id || undefined,
      image: row.dataset.image,
      imagePosition: row.dataset.imagePosition,
      href: row.querySelector('input[data-field="href"]').value,
      textAlign: row.dataset.textAlign,
      textVAlign: row.dataset.textValign,
      overlay: row.dataset.overlay,
      blocks: readBlocks(row)
    };
  }

  function buildAlignRow(row, key, options, label) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="align-group-ttl">${label}</div>`;
    const btnRow = document.createElement('div');
    btnRow.className = 'align-row';
    options.forEach(([value, text]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = text;
      btn.classList.toggle('active', row.dataset[key] === value);
      btn.addEventListener('click', () => {
        row.dataset[key] = value;
        btnRow.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyPreview(row);
      });
      btnRow.appendChild(btn);
    });
    wrap.appendChild(btnRow);
    return wrap;
  }

  function refreshBlockState(row) {
    const list = row.querySelector('.blocks');
    const blocks = Array.from(list.querySelectorAll('.block'));
    const empty = row.querySelector('.blocks-empty');
    empty.style.display = blocks.length ? 'none' : 'block';
    blocks.forEach((b, i) => {
      b.querySelector('.move-up').disabled = (i === 0);
      b.querySelector('.move-down').disabled = (i === blocks.length - 1);
    });
  }

  function buildBlock(row, cfg) {
    const block = document.createElement('div');
    block.className = 'block';
    block.dataset.type = cfg.type || 'body';
    block.dataset.scale = Number(cfg.scale) || 1;

    const pct = Math.round((Number(cfg.scale) || 1) * 100);
    block.innerHTML = `
      <div class="block-head">
        <div class="block-type"></div>
        <div class="block-move">
          <button type="button" class="move-up" aria-label="위로">↑</button>
          <button type="button" class="move-down" aria-label="아래로">↓</button>
        </div>
        <button type="button" class="block-del" aria-label="블록 삭제">×</button>
      </div>
      <textarea rows="2" placeholder="배너에 넣을 글 (엔터로 줄바꿈)"></textarea>
      <div class="block-scale">크기 <input type="range" min="60" max="300" value="${pct}"> <span class="val">${pct}%</span></div>
      <div class="block-colors">
        <span class="color-ctl">글자색 <input type="color" data-color="color"> <button type="button" class="reset" data-reset="color">기본</button></span>
        <span class="color-ctl">배경색 <input type="color" data-color="bgColor"> <button type="button" class="reset" data-reset="bgColor">기본</button></span>
      </div>
    `;
    block.querySelector('textarea').value = cfg.text || '';

    /* 색은 "기본(비움)" 상태가 있어야 한다 — 흰 글씨/흰 버튼이라는 원래 스타일을 그대로 쓰는
       경우다. <input type="color">는 빈 값을 표현하지 못하므로, 실제 값은 dataset에 두고
       입력칸은 보기용으로만 쓴다. '기본' 버튼이 켜져 있으면 dataset은 빈 문자열이다. */
    ['color', 'bgColor'].forEach((key) => {
      const initial = cfg[key] || '';
      block.dataset[key] = initial;
      const input = block.querySelector(`input[data-color="${key}"]`);
      const resetBtn = block.querySelector(`button[data-reset="${key}"]`);
      input.value = initial || (key === 'color' ? '#ffffff' : '#ffffff');
      resetBtn.classList.toggle('on', !initial);
      input.addEventListener('input', () => {
        block.dataset[key] = input.value;
        resetBtn.classList.remove('on');
        applyPreview(row);
      });
      resetBtn.addEventListener('click', () => {
        block.dataset[key] = '';
        resetBtn.classList.add('on');
        applyPreview(row);
      });
    });

    const typeWrap = block.querySelector('.block-type');
    BLOCK_TYPES.forEach(([value, text]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = text;
      btn.classList.toggle('active', block.dataset.type === value);
      btn.addEventListener('click', () => {
        block.dataset.type = value;
        typeWrap.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyPreview(row);
      });
      typeWrap.appendChild(btn);
    });

    block.querySelector('textarea').addEventListener('input', () => applyPreview(row));

    const range = block.querySelector('input[type="range"]');
    range.addEventListener('input', () => {
      block.dataset.scale = Number(range.value) / 100;
      block.querySelector('.block-scale .val').textContent = range.value + '%';
      applyPreview(row);
    });

    block.querySelector('.move-up').addEventListener('click', () => {
      const prev = block.previousElementSibling;
      if (prev) block.parentNode.insertBefore(block, prev);
      refreshBlockState(row);
      applyPreview(row);
    });
    block.querySelector('.move-down').addEventListener('click', () => {
      const next = block.nextElementSibling;
      if (next) block.parentNode.insertBefore(next, block);
      refreshBlockState(row);
      applyPreview(row);
    });
    block.querySelector('.block-del').addEventListener('click', () => {
      block.remove();
      refreshBlockState(row);
      applyPreview(row);
    });

    return block;
  }

  function addBlock(row, cfg) {
    row.querySelector('.blocks').appendChild(buildBlock(row, cfg || {}));
    refreshBlockState(row);
    applyPreview(row);
  }

  function renumberRows() {
    document.querySelectorAll('.banner-row').forEach((row, i) => {
      row.querySelector('.banner-row-head h3').textContent = `배너 ${i + 1}`;
    });
  }

  function buildRow(cfg) {
    const c = Object.assign({ image: '', imagePosition: '50% 50%', href: '', textAlign: 'left', textVAlign: 'bottom', overlay: 'strong', blocks: [] }, cfg);
    const m = /^(\d{1,3})% (\d{1,3})%$/.exec(c.imagePosition || '50% 50%');
    const x = m ? Number(m[1]) : 50, y = m ? Number(m[2]) : 50;

    const row = document.createElement('div');
    row.className = 'banner-row';
    row.dataset.id = c.id || '';
    row.dataset.image = c.image || '';
    row.dataset.imagePosition = `${x}% ${y}%`;
    row.dataset.textAlign = c.textAlign || 'left';
    row.dataset.textValign = c.textVAlign || 'bottom';
    row.dataset.overlay = c.overlay || 'strong';

    row.innerHTML = `
      <div class="banner-row-head"><h3></h3><button type="button" class="remove-btn">삭제</button></div>
      <div class="banner-slide"></div>
      <div class="edit-panel">
        <div class="field">
          <label>배너 이미지</label>
          <div class="upload-row">
            <input type="file" accept="image/png,image/jpeg,image/webp" class="upload-input" style="display:none;">
            <button type="button" class="upload-btn">이미지 업로드</button>
            <span class="upload-status"></span>
          </div>
        </div>

        <div class="align-group-ttl">배너 문구</div>
        <div class="blocks"></div>
        <div class="blocks-empty">문구 블록이 없어요. 아래에서 추가하면 이미지만 있는 배너도 만들 수 있어요.</div>
        <div class="block-add-row">
          <button type="button" data-add="label">+ 작은 라벨</button>
          <button type="button" data-add="title">+ 큰 제목</button>
          <button type="button" data-add="body">+ 본문</button>
          <button type="button" data-add="button">+ 버튼</button>
        </div>

        <div class="field" style="margin-top:14px;"><label>연결 링크 (배너 전체를 누르면 이동)</label><input type="text" data-field="href" value="${(c.href || '').replace(/"/g, '&quot;')}" maxlength="200"></div>

        <div class="align-placeholder-h"></div>
        <div class="align-placeholder-v"></div>
        <div class="align-placeholder-o"></div>

        <div class="align-group-ttl">이미지 위치</div>
        <div class="pos-controls">
          <label>가로 <input type="range" min="0" max="100" value="${x}" data-axis="x"> <span class="val">${x}%</span></label>
          <label>세로 <input type="range" min="0" max="100" value="${y}" data-axis="y"> <span class="val">${y}%</span></label>
        </div>
      </div>
    `;

    row.querySelector('.align-placeholder-h').replaceWith(buildAlignRow(row, 'textAlign', H_ALIGNS, '텍스트 가로 위치'));
    row.querySelector('.align-placeholder-v').replaceWith(buildAlignRow(row, 'textValign', V_ALIGNS, '텍스트 세로 위치'));
    row.querySelector('.align-placeholder-o').replaceWith(buildAlignRow(row, 'overlay', OVERLAYS, '이미지 위 어둠 (글자 가독성)'));

    (c.blocks || []).forEach((b) => row.querySelector('.blocks').appendChild(buildBlock(row, b)));

    row.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.add;
        addBlock(row, { type, text: type === 'button' ? '지금 보기 →' : '' });
      });
    });

    row.querySelector('input[data-field="href"]').addEventListener('input', () => applyPreview(row));

    row.querySelectorAll('input[data-axis]').forEach((input) => {
      input.addEventListener('input', () => {
        const xVal = row.querySelector('input[data-axis="x"]').value;
        const yVal = row.querySelector('input[data-axis="y"]').value;
        row.dataset.imagePosition = `${xVal}% ${yVal}%`;
        input.nextElementSibling.textContent = `${input.value}%`;
        applyPreview(row);
      });
    });

    const fileInput = row.querySelector('.upload-input');
    const uploadBtn = row.querySelector('.upload-btn');
    const uploadStatus = row.querySelector('.upload-status');
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      uploadStatus.textContent = '업로드 중...';
      const fd = new FormData();
      fd.append('image', file);
      try {
        const res = await fetch('/api/admin/banners/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) { uploadStatus.textContent = data.error || '업로드 실패'; return; }
        row.dataset.image = data.path;
        applyPreview(row);
        // 서버가 1440px JPEG로 줄여서 저장한다 — 얼마나 줄었는지 보여주면
        // 너무 큰 파일을 올렸을 때 감이 온다.
        const kb = (n) => Math.round(n / 1024).toLocaleString('ko-KR') + 'KB';
        uploadStatus.textContent = data.bytes
          ? `완료 · ${kb(data.originalBytes)} → ${kb(data.bytes)}`
          : '업로드 완료';
      } catch (e) {
        uploadStatus.textContent = '업로드 실패';
      }
    });

    row.querySelector('.remove-btn').addEventListener('click', () => {
      if (!confirm('이 배너를 삭제할까요? (전체 저장을 눌러야 실제로 반영돼요)')) return;
      row.remove();
      renumberRows();
    });

    refreshBlockState(row);
    applyPreview(row);
    return row;
  }

  function addRow(cfg) {
    const container = document.getElementById('rows');
    container.appendChild(buildRow(cfg || {}));
    renumberRows();
  }

  async function load() {
    const res = await fetch('/api/banners');
    const data = await res.json();
    const container = document.getElementById('rows');
    container.innerHTML = '';
    (data.banners || []).forEach((cfg) => container.appendChild(buildRow(cfg)));
    renumberRows();
  }

  document.getElementById('addBtn').addEventListener('click', () => addRow());

  document.getElementById('saveAllBtn').addEventListener('click', async () => {
    const rows = Array.from(document.querySelectorAll('.banner-row'));
    const missingImage = rows.some((row) => !row.dataset.image);
    if (missingImage) { showToast('이미지가 없는 배너가 있어요. 이미지를 업로드하거나 삭제해주세요.'); return; }

    const banners = rows.map(readRow);
    const res = await fetch('/api/admin/banners', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ banners })
    });
    if (!res.ok) { showToast('저장 실패'); return; }
    showToast('저장 완료 — 메인 페이지에 바로 반영돼요.');
  });

  (async () => {
    if (!(await checkAdmin())) return;
    load();
  })();
</script>
