<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>사주 도감 | 사주보는 수달</title>
  <meta name="description" content="실제 만세력으로 계산한 나만의 사주 도감을 무료로 만들어 보세요.">
  <link rel="canonical" href="https://sajuotter.com/field-guide.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="사주보는 수달">
  <meta property="og:title" content="사주 도감 | 사주보는 수달">
  <meta property="og:description" content="실제 만세력으로 계산한 나만의 사주 도감을 무료로 만들어 보세요.">
  <meta property="og:url" content="https://sajuotter.com/field-guide.html">
  <meta property="og:image" content="https://sajuotter.com/og-cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/field-guide.css">
  <link rel="stylesheet" href="/share-card.css">
</head>
<body>
  <div class="app fg-app no-nav">
    <header>
      <a class="logo" href="/" aria-label="사주보는 수달 홈"><img src="/logo.png" alt="사주보는 수달"></a>
      <span class="ttl">나의 사주 도감</span>
      <a class="home-link" href="/" aria-label="홈으로">홈</a>
    </header>
    <main class="fg-page">
      <section class="fg-intro" aria-labelledby="fgIntroTitle">
        <span class="fg-intro-kicker">무료 사주 콘텐츠</span>
        <h1 id="fgIntroTitle">수달이 기록해 주는 나의 사주 도감</h1>
        <p>태어난 순간의 여덟 글자와 지금의 흐름을 한 권의 도감처럼 모아봐.</p>
      </section>
      <form id="fieldGuideForm" class="fg-input-card" autocomplete="off">
        <div class="field">
          <label for="fgName">이름 <span class="fg-optional">선택</span></label>
          <input id="fgName" name="name" type="text" maxlength="10" placeholder="결과 표지에 표시할 이름">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fgGender">성별</label>
            <select id="fgGender" name="gender">
              <option value="남">남자</option>
              <option value="여">여자</option>
            </select>
          </div>
          <div class="field">
            <label for="fgCalendar">양력/음력</label>
            <select id="fgCalendar" name="calendar">
              <option value="양력">양력</option>
              <option value="음력">음력</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>생년월일</label>
          <div class="date-inputs">
            <input type="number" name="year" placeholder="년" min="1900" max="2100" required aria-label="태어난 해">
            <input type="number" name="month" placeholder="월" min="1" max="12" required aria-label="태어난 달">
            <input type="number" name="day" placeholder="일" min="1" max="31" required aria-label="태어난 날">
          </div>
        </div>
        <div class="field">
          <label>태어난 시각 <span class="fg-optional">알면 더 정확해</span></label>
          <div class="date-inputs">
            <input type="number" name="hour" placeholder="시 (0~23)" min="0" max="23" aria-label="태어난 시">
            <input type="number" name="minute" placeholder="분" min="0" max="59" aria-label="태어난 분">
          </div>
          <label class="checkbox-field fg-hour-unknown"><input type="checkbox" name="hourUnknown"> 시각 모름</label>
        </div>
        <p class="fg-form-note">이름은 결과 표지에만 표시돼. 결과는 재미로 참고해줘.</p>
        <button type="submit" id="fieldGuideSubmit">무료로 도감 만들기</button>
      </form>
      <div id="fieldGuideError" class="error-box hidden" role="alert"></div>
      <div id="fieldGuideResult" aria-live="polite"></div>
      <div id="fieldGuideActions" class="share-actions hidden" aria-label="사주 도감 저장 및 공유">
        <button type="button" id="fieldGuideImageSave">이미지 저장</button>
        <button type="button" id="fieldGuideLinkShare">친구에게 링크 공유</button>
        <p class="share-hint" id="fieldGuideShareStatus" aria-live="polite">이미지에는 생년월일시가 들어가지 않아. 공유 링크는 도감 입력 화면으로 연결돼.</p>
      </div>
    </main>
  </div>
  <script src="/field-guide-view.js"></script>
  <script src="/field-guide-share.js"></script>
  <script src="/field-guide-form.js"></script>
</body>
</html>
