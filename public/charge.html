<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-THWHBPH5WR');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 포인트 충전</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/reading-ui.css">
</head>
<body class="reading-page">
<div class="app">
  <header>
    <a class="back" href="/mypage.html">←</a>
    <div class="ttl">포인트 충전</div>
      <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>

    <div class="card">
      <div class="balance-row">
        <span class="label">내 포인트</span>
        <span class="value"><span id="balanceValue">0</span><span class="unit">P</span></span>
      </div>
    </div>

    <div class="card" id="cardChargeBox">
      <h3>카드로 충전하기</h3>
      <p class="hint" style="margin:-4px 0 12px;">신용·체크카드로 결제하면 포인트가 바로 충전돼요. 1P = 1원, 결제 즉시 반영.</p>
      <div class="chip-row" id="cardChips">
        <button type="button" class="chip" data-amount="5000">5,000원</button>
        <button type="button" class="chip" data-amount="10000">10,000원</button>
        <button type="button" class="chip" data-amount="15000">15,000원</button>
        <button type="button" class="chip" data-amount="30000">30,000원</button>
      </div>
      <form id="cardForm">
        <div class="field">
          <label>충전 금액(원)</label>
          <input type="number" name="amountKrw" id="cardAmount" min="1000" max="500000" step="100" required placeholder="예: 14900">
        </div>
        <button type="submit" class="primary" id="cardPayBtn">카드로 결제하기</button>
        <p class="hint" id="cardTestNote" style="display:none;margin-top:10px;"></p>
      </form>
    </div>

    <details class="card" id="bankChargeBox">
      <summary style="cursor:pointer;font-weight:800;font-size:14px;">계좌이체로 충전하기 (운영자 확인 후 지급)</summary>
      <div class="deposit-note" id="depositNote" style="margin-top:12px;">불러오는 중...</div>
      <div class="chip-row">
        <button type="button" class="chip bank-chip" data-amount="10000">10,000원</button>
        <button type="button" class="chip bank-chip" data-amount="30000">30,000원</button>
        <button type="button" class="chip bank-chip" data-amount="50000">50,000원</button>
        <button type="button" class="chip bank-chip" data-amount="100000">100,000원</button>
      </div>
      <form id="chargeForm">
        <div class="field">
          <label>충전 금액(원)</label>
          <input type="number" name="amountKrw" id="amountInput" min="1000" step="1000" required>
        </div>
        <div class="field">
          <label>입금자명 (본인 이름과 다르면 꼭 입력)</label>
          <input type="text" name="depositorName" placeholder="예: 홍길동">
        </div>
        <button type="submit" class="primary">충전 신청하기</button>
      </form>
    </details>

    <div class="card">
      <h3>충전 내역</h3>
      <div class="table-scroll">
        <table id="requestTable">
          <thead><tr><th>일시</th><th>방법</th><th>금액</th><th>상태</th></tr></thead>
          <tbody id="requestBody"></tbody>
        </table>
      </div>
      <div class="empty hidden" id="requestEmpty">아직 신청 내역이 없습니다.</div>
    </div>

  </main>
</div>
<div class="toast" id="toast"></div>

<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  async function requireLogin() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.user) {
      location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname);
      return null;
    }
    return data.user;
  }

  async function loadDepositInfo() {
    const res = await fetch('/api/points/deposit-info');
    const data = await res.json();
    document.getElementById('depositNote').innerHTML =
      `<b>입금 계좌:</b> ${data.account}<br><b>포인트 비율:</b> ${data.pointRate}<br>${data.notice}`;
  }

  const STATUS_LABEL = { pending: '승인 대기', approved: '승인 완료', rejected: '거절됨' };

  async function loadMine() {
    const res = await fetch('/api/points/mine');
    const data = await res.json();
    document.getElementById('balanceValue').textContent = data.balance.toLocaleString('ko-KR');

    // 계좌이체 신청과 카드 결제를 한 표에 시간순으로 섞는다.
    const cards = await fetch('/api/pay/mine').then((r) => (r.ok ? r.json() : { payments: [] })).then((d) => d.payments || []).catch(() => []);
    const rows = [
      ...data.requests.map((r) => ({ at: r.created_at, how: '계좌이체', amount: r.amount_krw, status: r.status, label: STATUS_LABEL[r.status] || r.status })),
      ...cards.filter((p) => p.status !== 'ready').map((p) => ({
        at: p.createdAt, how: p.testMode ? '카드(테스트)' : '카드', amount: p.amountKrw,
        status: p.status === 'paid' ? 'approved' : 'rejected',
        label: p.status === 'paid' ? (p.testMode ? '테스트 승인' : '충전 완료') : '실패'
      }))
    ].sort((a, b) => (a.at < b.at ? 1 : -1));
    const body = document.getElementById('requestBody');
    const empty = document.getElementById('requestEmpty');
    body.innerHTML = '';
    if (!rows.length) {
      empty.classList.remove('hidden');
    } else {
      empty.classList.add('hidden');
      rows.forEach((r) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${String(r.at).slice(0, 16).replace('T', ' ')}</td>
          <td>${r.how}</td>
          <td>${Number(r.amount).toLocaleString('ko-KR')}원</td>
          <td><span class="status ${r.status}">${r.label}</span></td>
        `;
        body.appendChild(tr);
      });
    }
  }

  function bindChips(selector, input) {
    document.querySelectorAll(selector).forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll(selector).forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        document.getElementById(input).value = chip.dataset.amount;
      });
    });
  }
  bindChips('#cardChips .chip', 'cardAmount');
  bindChips('.bank-chip', 'amountInput');

  // 카드 충전 — 주문을 먼저 만들고(서버가 금액 확정) 결제 페이지로 넘긴다.
  fetch('/api/pay/config').then((r) => r.json()).then((cfg) => {
    if (cfg.testMode) {
      const note = document.getElementById('cardTestNote');
      note.style.display = 'block';
      note.textContent = '현재 카드결제는 PG 심사 중인 테스트 모드예요. 결제창은 열리지만 실제 청구되지 않고 포인트도 지급되지 않습니다. 정식 오픈 전까지는 위의 계좌이체를 이용해주세요.';
      const cardBox = document.getElementById('cardChargeBox');
      const bankBox = document.getElementById('bankChargeBox');
      cardBox.parentNode.insertBefore(bankBox, cardBox);
      bankBox.open = true;
      bankBox.querySelector('summary').textContent = '계좌이체로 충전하기 (지금 이용 가능 · 운영자 확인 후 지급)';
    }
  }).catch(() => {});
  document.getElementById('cardForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('cardPayBtn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/pay/prepare', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amountKrw: Number(document.getElementById('cardAmount').value) })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || '결제 준비 실패'); btn.disabled = false; return; }
      location.href = '/pay.html?orderId=' + encodeURIComponent(data.orderId);
    } catch (err) {
      showToast('결제 준비 실패: ' + err.message);
      btn.disabled = false;
    }
  });

  document.getElementById('chargeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const res = await fetch('/api/points/request', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amountKrw: fd.get('amountKrw'), depositorName: fd.get('depositorName') })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || '신청 실패'); return; }
      showToast('충전 신청 완료 — 입금 확인 후 포인트가 지급됩니다.');
      e.target.reset();
      document.querySelectorAll('.bank-chip').forEach((c) => c.classList.remove('active'));
      loadMine();
    } catch (err) {
      showToast('요청 실패: ' + err.message);
    }
  });

  (async () => {
    const user = await requireLogin();
    if (!user) return;
    loadDepositInfo();
    loadMine();
  })();
</script>
</body>
</html>
