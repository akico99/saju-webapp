<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 빠른 리딩</title>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app no-nav">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl">빠른 리딩</div>
      <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
  <div class="brand-tag">사주보는 수달 · 길잡이 여울</div>
  <h1>빠른 리딩 정보 입력</h1>
  <p class="lead">생년월일시를 입력하면 실제 만세력 엔진으로 명식을 계산하고, 선택한 주제 하나만 짧게 짚어드립니다.</p>

  <div class="point-notice" id="pointNotice">가격 확인 중...</div>

  <form id="quickForm">
    <div class="profile-picker hidden" id="profilePicker"></div>
    <div class="field">
      <label>주제</label>
      <select name="topic" id="topicSelect">
        <option value="total">오늘의 나 — 총평</option>
        <option value="wealth">재물운</option>
        <option value="career">직업·적성운</option>
        <option value="love">애정운</option>
        <option value="relationship">인간관계</option>
      </select>
    </div>

    <div class="field">
      <label>이름</label>
      <input type="text" name="name" placeholder="예: 홍길동">
    </div>

    <div class="field-row">
      <div class="field">
        <label>생년월일</label>
        <div class="date-inputs">
          <input type="number" name="year" placeholder="년" min="1900" max="2100" required>
          <input type="number" name="month" placeholder="월" min="1" max="12" required>
          <input type="number" name="day" placeholder="일" min="1" max="31" required>
        </div>
      </div>
      <div class="field">
        <label>양력/음력</label>
        <select name="calendar">
          <option value="양력">양력</option>
          <option value="음력">음력</option>
        </select>
      </div>
    </div>
    <div class="field checkbox-field">
      <label><input type="checkbox" name="isLeap"> 음력 윤달</label>
    </div>

    <div class="field">
      <label>태어난 시각</label>
      <div class="date-inputs">
        <input type="number" name="hour" placeholder="시(0-23)" min="0" max="23">
        <input type="number" name="minute" placeholder="분" min="0" max="59">
      </div>
      <label class="checkbox-field"><input type="checkbox" name="hourUnknown"> 시각 모름 (정오로 가정)</label>
    </div>

    <div class="field">
      <label>성별</label>
      <select name="gender">
        <option value="남">남자</option>
        <option value="여">여자</option>
      </select>
    </div>

    <button type="submit" id="submitBtn">빠른 리딩 생성 시작</button>
  </form>

  <div id="result" class="result hidden">
    <div id="progressBlock">
      <h3>빠른 리딩 생성 중...</h3>
      <p id="progressText">잠시만 기다려주세요 (1분 내외)</p>
    </div>

    <div id="downloadBlock" class="hidden">
      <a id="downloadLink" href="#" class="download-btn">PDF 다운로드</a>
      <button type="button" id="shareBtn" class="download-btn card-btn">공유하기</button>

      <div class="topic-panel" style="margin-top:20px;">
        <div class="ttl">이 김에 다른 주제도 990원에 보기</div>
        <div class="chip-row" id="crossSellChips"></div>
      </div>
    </div>

    <div id="errorBlock" class="hidden error-box"></div>
  </div>

  </main>
</div>

<script>window.POINT_NOTICE_PRICE = 990; window.POINT_NOTICE_LABEL = '빠른 리딩';</script>
<script src="/point-notice.js"></script>
<script src="/profile-picker.js"></script>
<script src="/quick-app.js"></script>
</body>
</html>
