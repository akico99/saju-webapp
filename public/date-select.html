<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주보는 수달 — 날짜 선택(택일)</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .ds-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 28px; margin-bottom: 4px; }

  .bt-result { padding: 0 20px; display: none; }
  .bt-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
    padding: 16px 18px; margin-bottom: 12px; position: relative;
  }
  .bt-card.top { border-color: var(--ink); }
  .bt-card .rank { position: absolute; top: -9px; left: 14px; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: var(--radius-pill); }
  .bt-card .date-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .bt-card .date { font-size: 15px; font-weight: 800; color: var(--ink); }
  .bt-card .score { font-size: 13px; font-weight: 800; color: var(--accent); }
  .bt-card .ganzhi { font-size: 12px; color: var(--muted-2); margin-bottom: 8px; }
  .bt-card .reason { font-size: 13px; color: var(--muted); line-height: 1.7; }

  .bt-optional { margin: 20px 0 4px; }
  .bt-optional summary { font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; padding: 4px 0; }

  .ds-overview {
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius-card);
    padding: 16px 18px; margin-bottom: 16px;
  }
  .ds-overview .ttl { font-size: 12px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  .ds-overview .body { font-size: 13.5px; color: var(--ink); line-height: 1.8; white-space: pre-wrap; }
  .ds-overview .body strong { color: var(--accent); }

  .ds-extra {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
    padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .ds-extra .icon { font-size: 22px; }
  .ds-extra .ttl { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
  .ds-extra .val { font-size: 15px; font-weight: 800; color: var(--ink); }
  .ds-extra .note { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .ds-disclaimer {
    background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius-card);
    padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--muted); line-height: 1.6;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl" id="pageTtl">날짜 선택(택일)</div>
  </header>
  <main>
    <div class="ds-badge" id="dsBadge"></div>
    <h1 id="dsH1">언제가 좋을까</h1>
    <p class="lead" id="dsLead"></p>
    <div class="ds-disclaimer hidden" id="dsDisclaimer"></div>

    <div class="point-notice" id="pointNotice">가격 확인 중...</div>

    <form id="dsForm">
      <input type="hidden" name="occasion" id="occasionInput" value="moving">

      <div id="personFields">
        <div class="profile-picker hidden" id="profilePicker"></div>
        <div class="section-title" style="margin-top:0;">본인 정보 <span style="font-weight:400;color:var(--muted);">(이 날의 기운이 나에게 맞는지 보려면 필요해요)</span></div>
        <div class="field-row">
          <div class="field"><label>성별</label>
            <select name="gender"><option value="남">남자</option><option value="여">여자</option></select>
          </div>
          <div class="field"><label>양력/음력</label>
            <select name="calendar"><option value="양력">양력</option><option value="음력">음력</option></select>
          </div>
        </div>
        <div class="field">
          <label>생년월일</label>
          <div class="date-inputs">
            <input type="number" name="year" placeholder="년" min="1900" max="2100">
            <input type="number" name="month" placeholder="월" min="1" max="12">
            <input type="number" name="day" placeholder="일" min="1" max="31">
          </div>
        </div>
        <div class="field">
          <label>태어난 시각</label>
          <div class="date-inputs">
            <input type="number" name="hour" placeholder="시(0-23)" min="0" max="23">
            <input type="number" name="minute" placeholder="분" min="0" max="59">
          </div>
          <label class="checkbox-field"><input type="checkbox" name="hourUnknown"> 시각 모름 (정오로 가정)</label>
        </div>
      </div>

      <div id="parentFields" class="hidden">
        <details class="bt-optional" open>
          <summary>부모님 생년월일 입력하기 (선택 — 부모님과 부딪히는 날짜를 걸러드려요)</summary>
          <div class="section-title" style="margin-top:14px;">부모 1</div>
          <div class="profile-picker hidden" id="profilePickerA"></div>
          <div class="field">
            <label>생년월일</label>
            <div class="date-inputs">
              <input type="number" name="aYear" placeholder="년" min="1900" max="2100">
              <input type="number" name="aMonth" placeholder="월" min="1" max="12">
              <input type="number" name="aDay" placeholder="일" min="1" max="31">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>성별</label>
              <select name="aGender"><option value="남">남자</option><option value="여">여자</option></select>
            </div>
            <div class="field"><label>양력/음력</label>
              <select name="aCalendar"><option value="양력">양력</option><option value="음력">음력</option></select>
            </div>
          </div>

          <div class="section-title">부모 2 (선택)</div>
          <div class="profile-picker hidden" id="profilePickerB"></div>
          <div class="field">
            <label>생년월일</label>
            <div class="date-inputs">
              <input type="number" name="bYear" placeholder="년" min="1900" max="2100">
              <input type="number" name="bMonth" placeholder="월" min="1" max="12">
              <input type="number" name="bDay" placeholder="일" min="1" max="31">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>성별</label>
              <select name="bGender"><option value="여">여자</option><option value="남">남자</option></select>
            </div>
            <div class="field"><label>양력/음력</label>
              <select name="bCalendar"><option value="양력">양력</option><option value="음력">음력</option></select>
            </div>
          </div>
        </details>
      </div>

      <div id="dateFields">
        <div class="section-title" id="baseDateTtl">예정일</div>
        <div class="date-inputs">
          <input type="number" name="baseYear" placeholder="년" min="1900" max="2100">
          <input type="number" name="baseMonth" placeholder="월" min="1" max="12">
          <input type="number" name="baseDay" placeholder="일" min="1" max="31">
        </div>
        <div class="field" style="margin-top:14px;">
          <label>앞뒤로 며칠까지 볼까요</label>
          <select name="rangeDays">
            <option value="3">±3일</option>
            <option value="5" selected>±5일</option>
            <option value="7">±7일</option>
            <option value="10">±10일</option>
          </select>
        </div>
      </div>

      <div id="yearFields" class="hidden">
        <div class="section-title" id="yearTtl">예정 연도</div>
        <div class="field">
          <input type="number" name="year2" id="yearInput" placeholder="예: 2026" min="1900" max="2100">
        </div>
      </div>

      <button type="submit" id="submitBtn">좋은 날짜 찾기</button>
    </form>

    <div id="errorBox" class="error-box hidden"></div>

    <section class="bt-result" id="dsResult">
      <div class="section-head"><h2 id="resultTtl">이런 날짜는 어떠세요</h2></div>
      <div class="ds-overview hidden" id="dsOverview">
        <div class="ttl">AI 총평</div>
        <div class="body" id="dsOverviewBody"></div>
      </div>
      <div class="ds-extra hidden" id="dsDirection">
        <div class="icon">🧭</div>
        <div>
          <div class="ttl">이사하기 좋은 방향</div>
          <div class="val" id="dsDirectionVal"></div>
          <div class="note" id="dsDirectionNote"></div>
        </div>
      </div>
      <div class="ds-extra hidden" id="dsBusiness">
        <div class="icon">💼</div>
        <div>
          <div class="ttl">개업에 어울리는 분야</div>
          <div class="val" id="dsBusinessVal"></div>
          <div class="note" id="dsBusinessNote"></div>
        </div>
      </div>
      <div id="dsList"></div>
    </section>
  </main>
</div>

<script src="/profile-picker.js"></script>
<script>
  const form = document.getElementById('dsForm');
  const errorBox = document.getElementById('errorBox');
  const occasionInput = document.getElementById('occasionInput');
  const personFields = document.getElementById('personFields');
  const parentFields = document.getElementById('parentFields');
  const dateFields = document.getElementById('dateFields');
  const yearFields = document.getElementById('yearFields');
  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];

  // 각 주제는 독립된 상품(990원)이다 — 홈 화면에서 원하는 주제로 바로 들어와서 그
  // 주제 전용 페이지처럼 동작한다. 입력 방식도 주제마다 다르다:
  //  - 날짜 범위형(이사/개업): 예정일 + 앞뒤 며칠
  //  - 연도형(결혼/임신 시도): 연도 하나만 받아서 그 해의 좋은 "몇 월 몇째 주"를 찾음
  //  - 부모 모드(출산): 부모 정보 + 예정일 + 앞뒤 며칠
  const OCCASION_META = {
    moving: {
      label: '이사', emoji: '🏠', inputMode: 'date',
      lead: '이사하기 좋은 날짜와 방향을 찾아드려요. 이사 예정일 앞뒤로 오행이 잘 맞는 날짜·시간을 확인해보세요.',
      baseTtl: '이사 예정일'
    },
    opening: {
      label: '개업', emoji: '🏢', inputMode: 'date',
      lead: '개업하기 좋은 날짜와 어울리는 분야를 찾아드려요. 개업 예정일 앞뒤로 오행이 잘 맞는 날짜·시간을 확인해보세요.',
      baseTtl: '개업 예정일'
    },
    wedding: {
      label: '결혼', emoji: '💍', inputMode: 'year',
      lead: '결혼은 예식장·하객 사정상 미리 계획하는 일이라, 날짜 하나보다 어느 달·몇째 주가 좋은지로 알려드려요(자동으로 주말만 찾아요).',
      yearTtl: '결혼 예정 연도'
    },
    conception: {
      label: '임신 시도', emoji: '🌱', inputMode: 'year',
      lead: '한 해 동안 마음을 편히 갖기 좋은 흐름의 달·주를 찾아드려요.',
      yearTtl: '희망 연도',
      disclaimer: '이 결과는 배란일·가임기를 계산한 게 아니라, 명리학적으로 마음이 편안하고 좋은 흐름인 시기를 참고하는 것뿐이에요. 실제 임신 준비는 병원 상담을 통해 확인해주세요.'
    },
    birth: {
      label: '출산', emoji: '👶', inputMode: 'date',
      lead: '출산 예정일 앞뒤로 며칠, 그리고 하루 중 몇 개 시간대를 넣으면, 그 안에서 오행이 골고루 갖춰진 사주가 나오는 날짜·시간을 찾아드려요.',
      baseTtl: '출산 예정일'
    }
  };

  const preset = new URLSearchParams(location.search).get('occasion');
  const occasionKey = OCCASION_META[preset] ? preset : 'moving';
  const meta = OCCASION_META[occasionKey];
  occasionInput.value = occasionKey;
  document.title = `사주보는 수달 — ${meta.label} 날짜 선택`;
  document.getElementById('pageTtl').textContent = `${meta.label} 날짜 선택`;
  document.getElementById('dsBadge').textContent = meta.emoji;
  document.getElementById('dsH1').textContent = `${meta.label}하기 좋은 날은 언제일까`;
  document.getElementById('dsLead').textContent = meta.lead;
  document.getElementById('resultTtl').textContent = `${meta.label}하기 좋은 날짜는`;
  window.POINT_NOTICE_PRICE = 990;
  window.POINT_NOTICE_LABEL = `${meta.label} 날짜 선택`;

  if (meta.disclaimer) {
    const box = document.getElementById('dsDisclaimer');
    box.textContent = meta.disclaimer;
    box.classList.remove('hidden');
  }

  if (occasionKey === 'birth') {
    personFields.classList.add('hidden');
    parentFields.classList.remove('hidden');
  } else {
    personFields.classList.remove('hidden');
    parentFields.classList.add('hidden');
  }

  if (meta.inputMode === 'year') {
    dateFields.classList.add('hidden');
    yearFields.classList.remove('hidden');
    document.getElementById('yearTtl').textContent = meta.yearTtl;
    document.getElementById('yearInput').required = true;
  } else {
    dateFields.classList.remove('hidden');
    yearFields.classList.add('hidden');
    document.querySelector('#dateFields input[name="baseYear"]').required = true;
    document.querySelector('#dateFields input[name="baseMonth"]').required = true;
    document.querySelector('#dateFields input[name="baseDay"]').required = true;
    document.getElementById('baseDateTtl').textContent = meta.baseTtl;
  }

  const submitBtn = document.getElementById('submitBtn');
  function setFormBusy(busy) {
    form.querySelectorAll('input, select, button').forEach((el) => { el.disabled = busy; });
    submitBtn.textContent = busy ? '날짜 계산하고 AI 총평 쓰는 중...' : '좋은 날짜 찾기';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }
  function boldify(s) {
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function renderExtras(data) {
    const overviewBox = document.getElementById('dsOverview');
    if (data.overview) {
      document.getElementById('dsOverviewBody').innerHTML = boldify(data.overview);
      overviewBox.classList.remove('hidden');
    } else {
      overviewBox.classList.add('hidden');
    }

    const directionBox = document.getElementById('dsDirection');
    if (data.recommendedDirection) {
      document.getElementById('dsDirectionVal').textContent = `${data.recommendedDirection.direction} (용신 오행: ${data.recommendedDirection.ohaeng})`;
      document.getElementById('dsDirectionNote').textContent = data.recommendedDirection.note;
      directionBox.classList.remove('hidden');
    } else {
      directionBox.classList.add('hidden');
    }

    const businessBox = document.getElementById('dsBusiness');
    if (data.recommendedBusiness) {
      document.getElementById('dsBusinessVal').textContent = `${data.recommendedBusiness.field} (용신 오행: ${data.recommendedBusiness.ohaeng})`;
      document.getElementById('dsBusinessNote').textContent = data.recommendedBusiness.note;
      businessBox.classList.remove('hidden');
    } else {
      businessBox.classList.add('hidden');
    }
  }

  function renderRangeCards(data) {
    const list = document.getElementById('dsList');
    list.innerHTML = data.candidates.map((c, i) => {
      const d = new Date(c.year, c.month - 1, c.day);
      const weekday = WEEKDAY_KO[d.getDay()];
      return `
        <div class="bt-card ${i === 0 ? 'top' : ''}">
          ${i === 0 ? '<span class="rank">가장 좋아요</span>' : ''}
          <div class="date-row">
            <span class="date">${c.year}.${String(c.month).padStart(2, '0')}.${String(c.day).padStart(2, '0')} (${weekday}) ${c.hour}시</span>
            <span class="score">${c.score}점</span>
          </div>
          <div class="ganzhi">${c.ganZhiKo}일 · ${c.hourGanZhiKo}시</div>
          <div class="reason">${c.reasonText}</div>
        </div>
      `;
    }).join('');
  }

  function renderWeekCards(data) {
    const list = document.getElementById('dsList');
    list.innerHTML = data.weeks.map((w, i) => `
      <div class="bt-card ${i === 0 ? 'top' : ''}">
        ${i === 0 ? '<span class="rank">가장 좋아요</span>' : ''}
        <div class="date-row">
          <span class="date">${data.year}년 ${w.dateRangeLabel}</span>
          <span class="score">${w.score}점</span>
        </div>
        <div class="ganzhi">${w.ganZhiKo ? `대표일 ${w.ganZhiKo}일` : ''}${w.bestHourGanZhiKo ? ` · ${w.bestHourGanZhiKo}시` : ''}</div>
        <div class="reason">${w.reasonText}</div>
      </div>
    `).join('');
  }

  function render(data) {
    renderExtras(data);
    if (data.mode === 'year') {
      renderWeekCards(data);
    } else {
      renderRangeCards(data);
    }
    document.getElementById('dsResult').style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');

    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    body.hourUnknown = fd.get('hourUnknown') === 'on';
    if (meta.inputMode === 'year') body.targetYear = body.year2;
    setFormBusy(true);

    try {
      const res = await fetch('/api/date-select', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        setFormBusy(false);
        if (res.status === 401) { location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
        if (res.status === 402) { alert(`포인트가 부족합니다 (필요 ${data.required}P / 보유 ${data.balance}P). 마이페이지에서 충전해주세요.`); location.href = '/mypage.html'; return; }
        errorBox.textContent = data.error || '요청 실패';
        errorBox.classList.remove('hidden');
        return;
      }
      render(data);
      setFormBusy(false);
    } catch (err) {
      setFormBusy(false);
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
    }
  });

  if (window.ProfilePicker) {
    window.ProfilePicker.mount(document.getElementById('profilePicker'), form);
    window.ProfilePicker.mount(document.getElementById('profilePickerA'), form, { prefix: 'a' });
    window.ProfilePicker.mount(document.getElementById('profilePickerB'), form, { prefix: 'b' });
  }
</script>
<script src="/point-notice.js"></script>
</body>
</html>
