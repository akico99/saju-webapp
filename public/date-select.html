<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주보는 수달 — 날짜 선택(택일)</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .ds-occasion-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .ds-occasion {
    padding: 14px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper);
    font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .ds-occasion .emoji { font-size: 20px; }
  .ds-occasion.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .bt-result { padding: 0 20px; display: none; }
  .bt-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
    padding: 16px 18px; margin-bottom: 12px; position: relative;
  }
  .bt-card.top { border-color: var(--ink); }
  .bt-card .rank { position: absolute; top: -9px; left: 14px; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: var(--radius-pill); }
  .bt-card .date-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .bt-card .date { font-size: 15px; font-weight: 800; color: var(--ink); }
  .bt-card .score { font-size: 13px; font-weight: 800; color: var(--accent); }
  .bt-card .ganzhi { font-size: 12px; color: var(--muted-2); margin-bottom: 8px; }
  .bt-card .reason { font-size: 13px; color: var(--muted); line-height: 1.7; }

  .bt-optional { margin: 20px 0 4px; }
  .bt-optional summary { font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; padding: 4px 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl">날짜 선택(택일)</div>
  </header>
  <main>
    <h1>언제가 좋을까</h1>
    <p class="lead" id="dsLead">
      이사·개업·결혼·출산처럼 중요한 날, 예정일 앞뒤로 오행이 잘 맞는 날짜·시간을 찾아드려요.
    </p>

    <div class="ds-occasion-row" id="occasionRow">
      <button type="button" class="ds-occasion" data-value="moving"><span class="emoji">🏠</span>이사</button>
      <button type="button" class="ds-occasion" data-value="opening"><span class="emoji">🏢</span>개업</button>
      <button type="button" class="ds-occasion" data-value="wedding"><span class="emoji">💍</span>결혼</button>
      <button type="button" class="ds-occasion" data-value="birth"><span class="emoji">👶</span>출산</button>
    </div>

    <div class="point-notice" id="pointNotice">가격 확인 중...</div>

    <form id="dsForm">
      <input type="hidden" name="occasion" id="occasionInput" value="moving">

      <div id="personFields">
        <div class="profile-picker hidden" id="profilePicker"></div>
        <div class="section-title" style="margin-top:0;">본인 정보 <span style="font-weight:400;color:var(--muted);">(이 날의 기운이 나에게 맞는지 보려면 필요해요)</span></div>
        <div class="field-row">
          <div class="field"><label>성별</label>
            <select name="gender"><option value="남">남자</option><option value="여">여자</option></select>
          </div>
          <div class="field"><label>양력/음력</label>
            <select name="calendar"><option value="양력">양력</option><option value="음력">음력</option></select>
          </div>
        </div>
        <div class="field">
          <label>생년월일</label>
          <div class="date-inputs">
            <input type="number" name="year" placeholder="년" min="1900" max="2100">
            <input type="number" name="month" placeholder="월" min="1" max="12">
            <input type="number" name="day" placeholder="일" min="1" max="31">
          </div>
        </div>
        <div class="field">
          <label>태어난 시각</label>
          <div class="date-inputs">
            <input type="number" name="hour" placeholder="시(0-23)" min="0" max="23">
            <input type="number" name="minute" placeholder="분" min="0" max="59">
          </div>
          <label class="checkbox-field"><input type="checkbox" name="hourUnknown"> 시각 모름 (정오로 가정)</label>
        </div>
      </div>

      <div id="parentFields" class="hidden">
        <details class="bt-optional" open>
          <summary>부모님 생년월일 입력하기 (선택 — 부모님과 부딪히는 날짜를 걸러드려요)</summary>
          <div class="section-title" style="margin-top:14px;">부모 1</div>
          <div class="profile-picker hidden" id="profilePickerA"></div>
          <div class="field">
            <label>생년월일</label>
            <div class="date-inputs">
              <input type="number" name="aYear" placeholder="년" min="1900" max="2100">
              <input type="number" name="aMonth" placeholder="월" min="1" max="12">
              <input type="number" name="aDay" placeholder="일" min="1" max="31">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>성별</label>
              <select name="aGender"><option value="남">남자</option><option value="여">여자</option></select>
            </div>
            <div class="field"><label>양력/음력</label>
              <select name="aCalendar"><option value="양력">양력</option><option value="음력">음력</option></select>
            </div>
          </div>

          <div class="section-title">부모 2 (선택)</div>
          <div class="profile-picker hidden" id="profilePickerB"></div>
          <div class="field">
            <label>생년월일</label>
            <div class="date-inputs">
              <input type="number" name="bYear" placeholder="년" min="1900" max="2100">
              <input type="number" name="bMonth" placeholder="월" min="1" max="12">
              <input type="number" name="bDay" placeholder="일" min="1" max="31">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>성별</label>
              <select name="bGender"><option value="여">여자</option><option value="남">남자</option></select>
            </div>
            <div class="field"><label>양력/음력</label>
              <select name="bCalendar"><option value="양력">양력</option><option value="음력">음력</option></select>
            </div>
          </div>
        </details>
      </div>

      <div class="section-title" id="baseDateTtl">예정일</div>
      <div class="date-inputs">
        <input type="number" name="baseYear" placeholder="년" min="1900" max="2100" required>
        <input type="number" name="baseMonth" placeholder="월" min="1" max="12" required>
        <input type="number" name="baseDay" placeholder="일" min="1" max="31" required>
      </div>
      <div class="field" style="margin-top:14px;">
        <label>앞뒤로 며칠까지 볼까요</label>
        <select name="rangeDays">
          <option value="3">±3일</option>
          <option value="5" selected>±5일</option>
          <option value="7">±7일</option>
          <option value="10">±10일</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">좋은 날짜 찾기</button>
    </form>

    <div id="errorBox" class="error-box hidden"></div>

    <section class="bt-result" id="dsResult">
      <div class="section-head"><h2 id="resultTtl">이런 날짜는 어떠세요</h2></div>
      <div id="dsList"></div>
    </section>
  </main>
</div>

<script>window.POINT_NOTICE_PRICE = 2900; window.POINT_NOTICE_LABEL = '날짜 선택(택일)';</script>
<script src="/point-notice.js"></script>
<script src="/profile-picker.js"></script>
<script>
  const form = document.getElementById('dsForm');
  const errorBox = document.getElementById('errorBox');
  const occasionInput = document.getElementById('occasionInput');
  const personFields = document.getElementById('personFields');
  const parentFields = document.getElementById('parentFields');
  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];

  const OCCASION_META = {
    moving: { label: '이사', lead: '이사하기 좋은 날짜를 찾아드려요. 이사 예정일 앞뒤로 오행이 잘 맞는 날짜·시간을 확인해보세요.', baseTtl: '이사 예정일' },
    opening: { label: '개업', lead: '개업하기 좋은 날짜를 찾아드려요. 개업 예정일 앞뒤로 오행이 잘 맞는 날짜·시간을 확인해보세요.', baseTtl: '개업 예정일' },
    wedding: { label: '결혼', lead: '결혼하기 좋은 날짜를 찾아드려요. 결혼 예정일 앞뒤로 오행이 잘 맞는 날짜·시간을 확인해보세요.', baseTtl: '결혼 예정일' },
    birth: { label: '출산', lead: '출산 예정일 앞뒤로 며칠, 그리고 하루 중 몇 개 시간대를 넣으면, 그 안에서 오행이 골고루 갖춰진 사주가 나오는 날짜·시간을 찾아드려요.', baseTtl: '출산 예정일' }
  };

  function selectOccasion(value) {
    occasionInput.value = value;
    document.querySelectorAll('.ds-occasion').forEach((btn) => btn.classList.toggle('active', btn.dataset.value === value));
    const meta = OCCASION_META[value];
    document.getElementById('dsLead').textContent = meta.lead;
    document.getElementById('baseDateTtl').textContent = meta.baseTtl;
    document.getElementById('resultTtl').textContent = `${meta.label}하기 좋은 날짜는`;
    if (value === 'birth') {
      personFields.classList.add('hidden');
      parentFields.classList.remove('hidden');
    } else {
      personFields.classList.remove('hidden');
      parentFields.classList.add('hidden');
    }
  }
  document.querySelectorAll('.ds-occasion').forEach((btn) => {
    btn.addEventListener('click', () => selectOccasion(btn.dataset.value));
  });
  (function initOccasionFromUrl() {
    const preset = new URLSearchParams(location.search).get('occasion');
    selectOccasion(OCCASION_META[preset] ? preset : 'moving');
  })();

  function setFormBusy(busy) {
    form.querySelectorAll('input, select, button').forEach((el) => { el.disabled = busy; });
  }

  function render(data) {
    const list = document.getElementById('dsList');
    list.innerHTML = data.candidates.map((c, i) => {
      const d = new Date(c.year, c.month - 1, c.day);
      const weekday = WEEKDAY_KO[d.getDay()];
      return `
        <div class="bt-card ${i === 0 ? 'top' : ''}">
          ${i === 0 ? '<span class="rank">가장 좋아요</span>' : ''}
          <div class="date-row">
            <span class="date">${c.year}.${String(c.month).padStart(2, '0')}.${String(c.day).padStart(2, '0')} (${weekday}) ${c.hour}시</span>
            <span class="score">${c.score}점</span>
          </div>
          <div class="ganzhi">${c.ganZhiKo}일 · ${c.hourGanZhiKo}시</div>
          <div class="reason">${c.reasonText}</div>
        </div>
      `;
    }).join('');
    document.getElementById('dsResult').style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');

    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    body.hourUnknown = fd.get('hourUnknown') === 'on';
    setFormBusy(true);

    try {
      const res = await fetch('/api/date-select', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        setFormBusy(false);
        if (res.status === 401) { location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); return; }
        if (res.status === 402) { alert(`포인트가 부족합니다 (필요 ${data.required}P / 보유 ${data.balance}P). 마이페이지에서 충전해주세요.`); location.href = '/mypage.html'; return; }
        errorBox.textContent = data.error || '요청 실패';
        errorBox.classList.remove('hidden');
        return;
      }
      render(data);
      setFormBusy(false);
    } catch (err) {
      setFormBusy(false);
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
    }
  });

  if (window.ProfilePicker) {
    window.ProfilePicker.mount(document.getElementById('profilePicker'), form);
    window.ProfilePicker.mount(document.getElementById('profilePickerA'), form, { prefix: 'a' });
    window.ProfilePicker.mount(document.getElementById('profilePickerB'), form, { prefix: 'b' });
  }
</script>
</body>
</html>
