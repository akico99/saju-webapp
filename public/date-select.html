<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주보는 수달 — 날짜 선택(택일)</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .ds-icon-badge { width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .ds-icon-badge svg { width: 28px; height: 28px; color: var(--accent); }

  .ds-summary {
    background: var(--ink); color: #fff; border-radius: var(--radius-card);
    padding: 20px 20px; margin-bottom: 16px;
  }
  .ds-summary .label { font-size: 11.5px; opacity: .75; margin-bottom: 4px; }
  .ds-summary .date { font-size: 19px; font-weight: 800; }
  .ds-summary .sub { font-size: 12.5px; opacity: .8; margin-top: 4px; }

  .ds-report { padding: 28px 20px 24px; margin-top: 8px; border-top: 1px solid var(--line); display: none; }
  .ds-report .body { font-size: 14.5px; color: var(--ink); line-height: 1.9; white-space: pre-wrap; }
  .ds-report .body strong { color: var(--accent); }

  .ds-download {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
    padding: 14px 16px; margin-top: 20px;
  }
  .ds-download .txt { font-size: 12.5px; color: var(--muted); }
  .ds-download a.btn-download {
    flex-shrink: 0; background: var(--ink); color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: var(--radius-pill);
  }

  .bt-optional { margin: 20px 0 4px; }
  .bt-optional summary { font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; padding: 4px 0; }

  .ds-disclaimer {
    background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius-card);
    padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--muted); line-height: 1.6;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl" id="pageTtl">날짜 선택(택일)</div>
  </header>
  <main>
    <div class="ds-icon-badge" id="dsBadge"></div>
    <h1 id="dsH1">언제가 좋을까</h1>
    <p class="lead" id="dsLead"></p>
    <div class="ds-disclaimer hidden" id="dsDisclaimer"></div>

    <div class="point-notice" id="pointNotice">가격 확인 중...</div>

    <form id="dsForm">
      <input type="hidden" name="occasion" id="occasionInput" value="moving">

      <div id="personFields">
        <div class="profile-picker hidden" id="profilePicker"></div>
        <div class="section-title" style="margin-top:0;">본인 정보</div>
        <div class="field">
          <label>이름 <span style="font-weight:400;color:var(--muted);">(리포트에 표시돼요)</span></label>
          <input type="text" name="name" placeholder="이름" maxlength="20">
        </div>
        <div class="field-row">
          <div class="field"><label>성별</label>
            <select name="gender"><option value="남">남자</option><option value="여">여자</option></select>
          </div>
          <div class="field"><label>양력/음력</label>
            <select name="calendar"><option value="양력">양력</option><option value="음력">음력</option></select>
          </div>
        </div>
        <div class="field">
          <label>생년월일</label>
          <div class="date-inputs">
            <input type="number" name="year" id="reqYear" placeholder="년" min="1900" max="2100">
            <input type="number" name="month" id="reqMonth" placeholder="월" min="1" max="12">
            <input type="number" name="day" id="reqDay" placeholder="일" min="1" max="31">
          </div>
        </div>
        <div class="field">
          <label>태어난 시각</label>
          <div class="date-inputs">
            <input type="number" name="hour" placeholder="시(0-23)" min="0" max="23">
            <input type="number" name="minute" placeholder="분" min="0" max="59">
          </div>
          <label class="checkbox-field"><input type="checkbox" name="hourUnknown"> 시각 모름 (정오로 가정)</label>
        </div>
      </div>

      <div id="movingExtra" class="hidden">
        <div class="section-title">이사 정보</div>
        <div class="field-row">
          <div class="field"><label>목표 연도</label><input type="number" name="targetYear" id="targetYear" placeholder="예: 2026"></div>
          <div class="field"><label>목표 월</label><input type="number" name="targetMonth" id="targetMonth" placeholder="예: 5" min="1" max="12"></div>
        </div>
        <div class="field">
          <label>현재 거주지 <span style="font-weight:400;color:var(--muted);">(선택, 예: 서울 마포구)</span></label>
          <input type="text" name="currentAddress" placeholder="현재 사시는 곳" maxlength="40">
        </div>
      </div>

      <div id="openingExtra" class="hidden">
        <div class="section-title">개업 정보</div>
        <div class="field-row">
          <div class="field"><label>목표 연도</label><input type="number" name="targetYear2" id="targetYear2" placeholder="예: 2026"></div>
          <div class="field"><label>목표 월</label><input type="number" name="targetMonth2" id="targetMonth2" placeholder="예: 5" min="1" max="12"></div>
        </div>
        <div class="field">
          <label>준비 중인 업종</label>
          <select name="industry">
            <option value="">선택 안 함</option>
            <option value="요식업(카페·식당)">요식업(카페·식당)</option>
            <option value="소매·판매업">소매·판매업</option>
            <option value="교육·콘텐츠">교육·콘텐츠</option>
            <option value="상담·서비스업">상담·서비스업</option>
            <option value="제조·기술">제조·기술</option>
            <option value="온라인·무역">온라인·무역</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>

      <div id="weddingExtra" class="hidden">
        <div class="field" style="margin-bottom:14px;">
          <label>결혼 목표 연도</label>
          <input type="number" name="targetYear3" id="targetYear3" placeholder="예: 2026">
        </div>
        <div class="section-title">상대방 정보</div>
        <div class="profile-picker hidden" id="profilePickerP"></div>
        <div class="field">
          <label>이름</label>
          <input type="text" name="pName" placeholder="상대방 이름" maxlength="20">
        </div>
        <div class="field-row">
          <div class="field"><label>성별</label>
            <select name="pGender"><option value="여">여자</option><option value="남">남자</option></select>
          </div>
          <div class="field"><label>양력/음력</label>
            <select name="pCalendar"><option value="양력">양력</option><option value="음력">음력</option></select>
          </div>
        </div>
        <div class="field">
          <label>생년월일</label>
          <div class="date-inputs">
            <input type="number" name="pYear" id="reqPYear" placeholder="년" min="1900" max="2100">
            <input type="number" name="pMonth" id="reqPMonth" placeholder="월" min="1" max="12">
            <input type="number" name="pDay" id="reqPDay" placeholder="일" min="1" max="31">
          </div>
        </div>
        <div class="field">
          <label>태어난 시각</label>
          <div class="date-inputs">
            <input type="number" name="pHour" placeholder="시(0-23)" min="0" max="23">
            <input type="number" name="pMinute" placeholder="분" min="0" max="59">
          </div>
          <label class="checkbox-field"><input type="checkbox" name="pHourUnknown"> 시각 모름 (정오로 가정)</label>
        </div>
      </div>

      <div id="parentFields" class="hidden">
        <details class="bt-optional" open>
          <summary>부모님 생년월일 입력하기 (부모님과 부딪히는 날짜를 걸러드려요)</summary>
          <div class="section-title" style="margin-top:14px;">부모 1</div>
          <div class="profile-picker hidden" id="profilePickerA"></div>
          <div class="field"><label>이름</label><input type="text" name="aName" placeholder="이름" maxlength="20"></div>
          <div class="field">
            <label>생년월일</label>
            <div class="date-inputs">
              <input type="number" name="aYear" id="reqAYear" placeholder="년" min="1900" max="2100">
              <input type="number" name="aMonth" id="reqAMonth" placeholder="월" min="1" max="12">
              <input type="number" name="aDay" id="reqADay" placeholder="일" min="1" max="31">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>성별</label>
              <select name="aGender"><option value="남">남자</option><option value="여">여자</option></select>
            </div>
            <div class="field"><label>양력/음력</label>
              <select name="aCalendar"><option value="양력">양력</option><option value="음력">음력</option></select>
            </div>
          </div>

          <div class="section-title">부모 2 (선택)</div>
          <div class="profile-picker hidden" id="profilePickerB"></div>
          <div class="field"><label>이름</label><input type="text" name="bName" placeholder="이름" maxlength="20"></div>
          <div class="field">
            <label>생년월일</label>
            <div class="date-inputs">
              <input type="number" name="bYear" placeholder="년" min="1900" max="2100">
              <input type="number" name="bMonth" placeholder="월" min="1" max="12">
              <input type="number" name="bDay" placeholder="일" min="1" max="31">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>성별</label>
              <select name="bGender"><option value="여">여자</option><option value="남">남자</option></select>
            </div>
            <div class="field"><label>양력/음력</label>
              <select name="bCalendar"><option value="양력">양력</option><option value="음력">음력</option></select>
            </div>
          </div>
        </details>

        <div class="section-title" id="baseDateTtl">출산 예정일</div>
        <div class="date-inputs">
          <input type="number" name="baseYear" id="reqBaseYear" placeholder="년" min="1900" max="2100">
          <input type="number" name="baseMonth" id="reqBaseMonth" placeholder="월" min="1" max="12">
          <input type="number" name="baseDay" id="reqBaseDay" placeholder="일" min="1" max="31">
        </div>
        <div class="field" style="margin-top:14px;">
          <label>앞뒤로 며칠까지 볼까요</label>
          <select name="rangeDays">
            <option value="3">±3일</option>
            <option value="5" selected>±5일</option>
            <option value="7">±7일</option>
            <option value="10">±10일</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn" style="margin-top:20px;">리포트 만들기</button>
    </form>

    <div id="errorBox" class="error-box hidden"></div>

    <section class="ds-report" id="dsResult">
      <div class="ds-summary hidden" id="dsSummary">
        <div class="label" id="dsSummaryLabel"></div>
        <div class="date" id="dsSummaryDate"></div>
        <div class="sub" id="dsSummarySub"></div>
      </div>
      <div class="body" id="dsReportBody"></div>
      <div class="ds-download hidden" id="dsDownload">
        <div class="txt">PDF로 저장해서 두고두고 볼 수 있어요. 마이페이지에서도 언제든 다시 받을 수 있어요.</div>
        <a class="btn-download" id="dsDownloadLink" href="#" target="_blank" rel="noopener">PDF 다운로드</a>
      </div>
    </section>
  </main>
</div>

<script src="/profile-picker.js"></script>
<script>
  const form = document.getElementById('dsForm');
  const errorBox = document.getElementById('errorBox');
  const occasionInput = document.getElementById('occasionInput');
  const personFields = document.getElementById('personFields');
  const parentFields = document.getElementById('parentFields');
  const movingExtra = document.getElementById('movingExtra');
  const openingExtra = document.getElementById('openingExtra');
  const weddingExtra = document.getElementById('weddingExtra');

  const ICONS = {
    moving: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M10 20v-5h4v5"/></svg>',
    opening: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v4"/><path d="M3 9h18l-1.5 3.5a2 2 0 0 1-3.7 0A2 2 0 0 1 12 12.5a2 2 0 0 1-3.8 0 2 2 0 0 1-3.7 0L3 9Z"/><path d="M5 12.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7.5"/><path d="M10 21v-5h4v5"/></svg>',
    wedding: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="15" r="5"/><circle cx="15" cy="15" r="5"/></svg>',
    birth: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.35-9-8.5C1.5 8 3 5 6.2 5c2 0 3.2 1.2 3.8 2.2C10.6 6.2 11.8 5 13.8 5 17 5 18.5 8 21 11.5c-2 4.15-9 8.5-9 8.5Z"/><path d="M12 11v4M10.2 12.5c0-1 .8-1.8 1.8-1.8s1.8.8 1.8 1.8"/></svg>'
  };

  const OCCASION_META = {
    moving: { label: '이사', lead: '이사하기 좋은 날짜, 방향, 그리고 새집에 가장 먼저 들이면 좋은 물건까지 하나의 리포트로 알려드려요.' },
    opening: { label: '개업', lead: '개업하기 좋은 날짜와 공간에 힘을 더할 소품, 초반 마음가짐까지 하나의 리포트로 알려드려요.' },
    wedding: { label: '결혼', lead: '두 사람 모두에게 좋은 혼인신고 날짜와 실제 궁합, 웨딩 무드까지 하나의 리포트로 알려드려요.' },
    birth: {
      label: '임신·출산', lead: '오행이 골고루 갖춰지는 좋은 시기와, 그 시기 아이의 기질까지 하나의 리포트로 알려드려요.',
      disclaimer: '이 리포트는 배란일·가임기 등 의학적 예측이 아니라, 명리학적으로 오행이 골고루 갖춰지는 시기를 참고하는 것뿐이에요. 실제 임신·출산 계획은 병원 상담을 통해 확인해주세요.'
    }
  };

  const preset = new URLSearchParams(location.search).get('occasion');
  const occasionKey = OCCASION_META[preset] ? preset : 'moving';
  const meta = OCCASION_META[occasionKey];
  occasionInput.value = occasionKey;
  document.title = `사주보는 수달 — ${meta.label} 리포트`;
  document.getElementById('pageTtl').textContent = `${meta.label} 리포트`;
  document.getElementById('dsBadge').innerHTML = ICONS[occasionKey];
  document.getElementById('dsH1').textContent = `${meta.label} 리포트`;
  document.getElementById('dsLead').textContent = meta.lead;
  window.POINT_NOTICE_PRICE = 990;
  window.POINT_NOTICE_LABEL = `${meta.label} 리포트`;

  if (meta.disclaimer) {
    const box = document.getElementById('dsDisclaimer');
    box.textContent = meta.disclaimer;
    box.classList.remove('hidden');
  }

  // 목표 연도는 서버도 "올해~5년 후"만 허용한다 — 화면에서부터 그 범위를 벗어난 값을
  // 아예 못 넣게 막아서, 제출한 뒤에야 오류 메시지로 알게 되는 일을 줄인다.
  (function boundTargetYearInputs() {
    const nowYear = new Date().getFullYear();
    ['targetYear', 'targetYear2', 'targetYear3'].forEach((id) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.min = nowYear;
      el.max = nowYear + 5;
    });
  })();

  // required는 HTML에 미리 박아두지 않는다 — 화면에서 실제로 감춘 다른 주제 섹션의
  // 필드까지 "필수인데 비어있다"고 판정해 제출 자체를 막아버리는 문제가 있었다(감춰진
  // 섹션이 display:none이어도 그 안의 required 필드가 계속 :invalid로 잡힘). 그래서
  // 지금 보여주는 섹션의 필드에만, 보여줄 때 그 자리에서 required를 붙인다.
  function markRequired(...ids) {
    ids.forEach((id) => { const el = document.getElementById(id); if (el) el.required = true; });
  }

  if (occasionKey === 'birth') {
    personFields.classList.add('hidden');
    parentFields.classList.remove('hidden');
    markRequired('reqAYear', 'reqAMonth', 'reqADay', 'reqBaseYear', 'reqBaseMonth', 'reqBaseDay');
  } else {
    markRequired('reqYear', 'reqMonth', 'reqDay');
    if (occasionKey === 'moving') {
      movingExtra.classList.remove('hidden');
      markRequired('targetYear', 'targetMonth');
    } else if (occasionKey === 'opening') {
      openingExtra.classList.remove('hidden');
      markRequired('targetYear2', 'targetMonth2');
    } else if (occasionKey === 'wedding') {
      weddingExtra.classList.remove('hidden');
      markRequired('targetYear3', 'reqPYear', 'reqPMonth', 'reqPDay');
    }
  }

  const submitBtn = document.getElementById('submitBtn');
  function setFormBusy(busy) {
    form.querySelectorAll('input, select, button').forEach((el) => { el.disabled = busy; });
    submitBtn.textContent = busy ? '리포트를 쓰는 중이에요...' : '리포트 만들기';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }
  function boldify(s) {
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  function render(data) {
    const summaryBox = document.getElementById('dsSummary');
    if (data.best) {
      const d = new Date(data.best.year, data.best.month - 1, data.best.day);
      const weekday = WEEKDAY_KO[d.getDay()];
      const summaryWho = `${data.name || ''}${data.spouseName ? ' · ' + data.spouseName : ''}`.trim();
      document.getElementById('dsSummaryLabel').textContent = summaryWho ? `${summaryWho} ${meta.label}에 가장 좋은 때` : `${meta.label}에 가장 좋은 때`;
      document.getElementById('dsSummaryDate').textContent = `${data.best.year}.${String(data.best.month).padStart(2, '0')}.${String(data.best.day).padStart(2, '0')} (${weekday}) ${data.best.hour}시`;
      document.getElementById('dsSummarySub').textContent = `${data.best.ganZhiKo}일 · ${data.best.hourGanZhiKo}시`;
      summaryBox.classList.remove('hidden');
    } else {
      summaryBox.classList.add('hidden');
    }

    document.getElementById('dsReportBody').innerHTML = data.report
      ? boldify(data.report)
      : '리포트를 만드는 데 문제가 생겼어요. 잠시 후 다시 시도해주세요.';

    const downloadBox = document.getElementById('dsDownload');
    if (data.jobId) {
      document.getElementById('dsDownloadLink').href = `/api/download/${data.jobId}`;
      downloadBox.classList.remove('hidden');
    } else {
      downloadBox.classList.add('hidden');
    }

    document.getElementById('dsResult').style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');

    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    body.hourUnknown = fd.get('hourUnknown') === 'on';
    body.pHourUnknown = fd.get('pHourUnknown') === 'on';
    if (occasionKey === 'opening') { body.targetYear = body.targetYear2; body.targetMonth = body.targetMonth2; }
    if (occasionKey === 'wedding') body.targetYear = body.targetYear3;
    setFormBusy(true);

    try {
      const res = await fetch('/api/date-select', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        setFormBusy(false);
        if (res.status === 401) { location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
        if (res.status === 402) { alert(`포인트가 부족합니다 (필요 ${data.required}P / 보유 ${data.balance}P). 마이페이지에서 충전해주세요.`); location.href = '/mypage.html'; return; }
        errorBox.textContent = data.error || '요청 실패';
        errorBox.classList.remove('hidden');
        return;
      }
      render(data);
      setFormBusy(false);
    } catch (err) {
      setFormBusy(false);
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
    }
  });

  if (window.ProfilePicker) {
    window.ProfilePicker.mount(document.getElementById('profilePicker'), form);
    window.ProfilePicker.mount(document.getElementById('profilePickerP'), form, { prefix: 'p' });
    window.ProfilePicker.mount(document.getElementById('profilePickerA'), form, { prefix: 'a' });
    window.ProfilePicker.mount(document.getElementById('profilePickerB'), form, { prefix: 'b' });
  }
</script>
<script src="/point-notice.js"></script>
</body>
</html>
