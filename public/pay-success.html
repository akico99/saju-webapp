<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 결제 완료</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/reading-ui.css">
<style>
  .done-cover { padding: 30px 26px; border-radius: 24px; color: #fff; background: radial-gradient(circle at 92% 0%, rgba(226,194,122,.22), transparent 36%), linear-gradient(160deg, #223650, #111d31 70%); }
  .done-cover .kicker { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #e2c27a; }
  .done-cover h1 { margin: 12px 0 0; font-family: var(--font-serif); font-size: 30px; line-height: 1.3; letter-spacing: -.04em; }
  .done-cover p { margin: 12px 0 0; font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.75); }
  .done-cover .amount { margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: rgba(255,255,255,.7); }
  .done-cover .amount b { font-size: 30px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .receipt { margin-top: 16px; }
  .receipt dt { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .receipt dd { font-size: 14px; color: var(--ink); font-weight: 700; margin: 2px 0 0; word-break: break-all; }
  .test-note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px; line-height: 1.65; }
  .actions { display: grid; gap: 8px; margin-top: 18px; }
  .actions a { display: block; padding: 15px; border-radius: 14px; text-align: center; font-size: 15px; font-weight: 800; text-decoration: none; }
  .actions a.primary { background: var(--ink); color: #fff; }
  .actions a.ghost { border: 1.5px solid var(--ink); color: var(--ink); background: #fff; }
</style>
</head>
<body class="reading-page">
<div class="app no-nav">
  <header>
    <a class="back" href="/mypage.html">←</a>
    <div class="ttl">결제 완료</div>
    <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
    <section class="done-cover">
      <div class="kicker">카드 결제</div>
      <h1 id="ttl">결제를 확인하고 있어요</h1>
      <p id="desc">잠시만 기다려주세요. 승인이 끝나면 리포트 생성이 바로 시작됩니다.</p>
      <div class="amount hidden" id="amountRow"><span id="orderNameEl"></span><b id="amountEl"></b></div>
    </section>
    <div class="test-note hidden" id="testNote">테스트 모드 결제예요 — 카드에 실제로 청구되지 않았습니다. 리포트는 실제와 똑같이 생성됩니다.</div>
    <div class="card receipt hidden" id="receipt">
      <dl>
        <dt>결제 수단</dt><dd id="rMethod">-</dd>
        <dt>승인 시각</dt><dd id="rApprovedAt">-</dd>
        <dt>주문번호</dt><dd id="rOrderId">-</dd>
      </dl>
    </div>
    <div class="error-box hidden" id="errorBox" style="margin-top:16px;"></div>
    <div class="actions hidden" id="actions">
      <a class="primary hidden" id="goReport" href="#">리포트 생성 진행 보기</a>
      <a class="ghost" href="/mypage.html">마이페이지에서 보기</a>
    </div>
  </main>
</div>
<script src="/pay-flow.js"></script>
<script>
  async function run() {
    const params = new URLSearchParams(location.search);
    const paymentKey = params.get('paymentKey'), orderId = params.get('orderId'), amount = params.get('amount');
    const ttl = document.getElementById('ttl'), desc = document.getElementById('desc'), errorBox = document.getElementById('errorBox');
    const show = (id) => document.getElementById(id).classList.remove('hidden');

    // pay.html이 이미 승인된 주문으로 되돌아온 경우 — 내 결제 목록에서 읽어 보여준다.
    if (params.get('done') && orderId) {
      const mine = await fetch('/api/pay/mine').then((r) => r.json()).catch(() => ({ payments: [] }));
      const p = (mine.payments || []).find((x) => x.orderId === orderId);
      if (p) return render(p, { jobId: p.jobId, page: '/mypage.html' });
    }
    if (!paymentKey || !orderId || !amount) {
      ttl.textContent = '결제 정보가 없어요';
      desc.textContent = '상품 페이지에서 다시 시작해주세요.';
      show('actions');
      return;
    }
    try {
      const res = await fetch('/api/pay/confirm', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentKey, orderId, amount })
      });
      const data = await res.json();
      if (!res.ok) {
        ttl.textContent = data.canceled === false ? '결제는 됐지만 리포트를 시작하지 못했어요' : '결제가 완료되지 않았어요';
        desc.textContent = data.error || '알 수 없는 오류';
        if (data.code) { errorBox.textContent = `오류 코드: ${data.code}`; show('errorBox'); }
        show('actions');
        return;
      }
      render(data.payment, data);
    } catch (e) {
      ttl.textContent = '결제 확인 중 오류가 났어요';
      desc.textContent = e.message;
      show('actions');
    }

    function render(p, data) {
      ttl.textContent = data.alreadyConfirmed ? '이미 결제가 완료된 주문이에요' : '결제가 완료됐어요';
      desc.textContent = data.jobId
        ? '리포트 생성이 시작됐어요. 아래 버튼을 누르면 진행 상황과 결과를 볼 수 있어요.'
        : '결제 내역은 마이페이지에서 확인할 수 있어요.';
      document.getElementById('orderNameEl').textContent = p.orderName;
      document.getElementById('amountEl').textContent = p.amountKrw.toLocaleString('ko-KR') + '원';
      show('amountRow');
      if (p.testMode) show('testNote');
      document.getElementById('rMethod').textContent = p.method || '-';
      document.getElementById('rApprovedAt').textContent = p.approvedAt ? new Date(p.approvedAt).toLocaleString('ko-KR') : '-';
      document.getElementById('rOrderId').textContent = p.orderId;
      show('receipt'); show('actions');
      if (data.jobId && data.page && data.page !== '/mypage.html') {
        // 상품 페이지가 ?jobId=로 진행 상황에 다시 붙는다. 시작 응답(요약 등)은 세션에 넘긴다.
        PayFlow.stash(data.jobId, data.payload || {});
        const url = data.page + (data.page.includes('?') ? '&' : '?') + 'jobId=' + encodeURIComponent(data.jobId);
        const go = document.getElementById('goReport');
        go.href = url; go.classList.remove('hidden');
        setTimeout(() => { location.href = url; }, 1800);
      }
    }
  }
  run();
</script>
</body>
</html>
