<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 약관 동의</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/reading-ui.css">
</head>
<body class="reading-page">
<div class="app no-nav">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl">약관 동의</div>
    <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
    <h1>서비스를 이용하려면 동의가 필요해요</h1>
    <p class="lead">사주 계산에 쓰는 생년월일시와 결제 기록을 어떻게 다루는지 확인하고 동의해 주세요.</p>
    <div id="errorBox" class="error-box hidden"></div>
    <form id="consentForm">
      <div id="consentBlock"></div>
      <button type="submit" id="consentSubmit" disabled>동의하고 계속하기</button>
    </form>
  </main>
</div>
<script src="/consent-block.js"></script>
<script>
  (async function () {
    const errorBox = document.getElementById('errorBox');
    const submit = document.getElementById('consentSubmit');
    const raw = new URLSearchParams(location.search).get('next') || '/';
    // 같은 사이트 안의 경로로만 돌려보낸다(//다른사이트 같은 주소는 막는다).
    const next = raw.startsWith('/') && !raw.startsWith('//') ? raw : '/';

    const me = await fetch('/api/auth/me').then((r) => r.json()).catch(() => ({}));
    if (!me.user) { location.replace('/login.html?redirect=' + encodeURIComponent(location.pathname + location.search)); return; }
    if (!me.needsConsent) { location.replace(next); return; }

    const block = ConsentBlock.mount(document.getElementById('consentBlock'), (ok) => { submit.disabled = !ok; });
    document.getElementById('consentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!block.isValid()) return;
      submit.disabled = true;
      errorBox.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/consent', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(block.values())
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '동의 처리에 실패했어요.');
        location.replace(next);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        submit.disabled = !block.isValid();
      }
    });
  })();
</script>
</body>
</html>
