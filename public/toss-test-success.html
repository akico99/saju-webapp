<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 결제 완료(테스트)</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .result-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 20px; margin-top: 20px; }
  .result-card dt { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .result-card dd { font-size: 14px; color: var(--ink); font-weight: 700; margin: 2px 0 0; word-break: break-all; }
  .test-badge { display: inline-block; font-size: 11px; font-weight: 800; color: var(--danger); background: var(--danger-soft); padding: 4px 10px; border-radius: var(--radius-pill); margin-bottom: 14px; }
</style>
</head>
<body>
<div class="app no-nav">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl">결제 완료</div>
    <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
    <span class="test-badge">TEST MODE · 실제 결제 아님</span>
    <h1 id="ttl">결제를 확인하고 있어요...</h1>
    <p class="lead" id="desc">잠시만 기다려주세요.</p>

    <div class="result-card hidden" id="resultCard">
      <dl>
        <dt>상품</dt><dd id="rOrderName">-</dd>
        <dt>결제 금액</dt><dd id="rAmount">-</dd>
        <dt>주문번호(orderId)</dt><dd id="rOrderId">-</dd>
        <dt>결제키(paymentKey)</dt><dd id="rPaymentKey">-</dd>
        <dt>결제 수단</dt><dd id="rMethod">-</dd>
        <dt>승인 시각</dt><dd id="rApprovedAt">-</dd>
      </dl>
    </div>

    <div class="error-box hidden" id="errorBox" style="margin-top:16px;"></div>
    <a href="/toss-test-checkout.html" class="download-btn" style="margin-top:20px;display:inline-block;">다시 테스트하기</a>
  </main>
</div>

<script>
  async function run() {
    const params = new URLSearchParams(window.location.search);
    const paymentKey = params.get('paymentKey');
    const orderId = params.get('orderId');
    const amount = params.get('amount');

    const ttl = document.getElementById('ttl');
    const desc = document.getElementById('desc');
    const errorBox = document.getElementById('errorBox');

    if (!paymentKey || !orderId || !amount) {
      ttl.textContent = '잘못된 접근이에요';
      desc.textContent = '결제 정보가 없어요. 처음부터 다시 시도해주세요.';
      return;
    }

    try {
      const res = await fetch('/api/toss-test/confirm', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentKey, orderId, amount })
      });
      const data = await res.json();
      if (!res.ok) {
        ttl.textContent = '결제 승인에 실패했어요';
        desc.textContent = data.error || '알 수 없는 오류';
        errorBox.textContent = JSON.stringify(data, null, 2);
        errorBox.classList.remove('hidden');
        return;
      }
      const p = data.payment;
      ttl.textContent = '결제가 완료됐어요 (테스트)';
      desc.textContent = '아래는 토스페이먼츠 승인 API가 실제로 응답한 내용이에요.';
      document.getElementById('rOrderName').textContent = p.orderName;
      document.getElementById('rAmount').textContent = Number(p.totalAmount).toLocaleString('ko-KR') + '원';
      document.getElementById('rOrderId').textContent = p.orderId;
      document.getElementById('rPaymentKey').textContent = p.paymentKey;
      document.getElementById('rMethod').textContent = p.method || '-';
      document.getElementById('rApprovedAt').textContent = p.approvedAt || '-';
      document.getElementById('resultCard').classList.remove('hidden');
    } catch (e) {
      ttl.textContent = '오류가 발생했어요';
      desc.textContent = e.message;
    }
  }
  run();
</script>
</body>
</html>
