<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-THWHBPH5WR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-THWHBPH5WR');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 오늘의 운세</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .tf-summary-list { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.9; color: #fff; opacity: .92; }
  .tf-weather { display: flex; align-items: center; gap: 14px; }
  .tf-weather .icon { font-size: 40px; line-height: 1; }
  .tf-weather .label { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .tf-weather .note { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .tf-dodont { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tf-dodont .col-ttl { font-size: 12px; font-weight: 800; margin-bottom: 8px; }
  .tf-dodont .do .col-ttl { color: var(--success); }
  .tf-dodont .dont .col-ttl { color: var(--danger); }
  .tf-dodont ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.7; color: var(--ink); }
  .tf-quest-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .tf-quest-item:last-child { border-bottom: none; }
  .tf-quest-item input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }
  .tf-quest-item.done span { text-decoration: line-through; color: var(--muted); }
  /* 7일 흐름 — 막대 7개와 이번 주 최고일. 점수만 보여주고 날짜별 해설은 그날 들어와서
     보게 둔다(재방문 이유). 최고일 막대는 accent, 오늘은 굵은 라벨. */
  .tf-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; margin-top: 6px; }
  .tf-week .day { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .tf-week .bar { width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: var(--surface-2); min-height: 6px; transition: height .3s; }
  .tf-week .day.best .bar { background: var(--gold); }
  .tf-week .day.today .bar { background: var(--ink); }
  .tf-week .day.best.today .bar { background: var(--gold); }
  .tf-week .num { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tf-week .day.best .num, .tf-week .day.today .num { color: var(--ink); }
  .tf-week .wd { font-size: 11px; color: var(--muted); }
  .tf-week .day.today .wd { color: var(--ink); font-weight: 800; }
  .tf-week-best { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
  .tf-week-best b { color: #8A6412; }

  .tf-upsell { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--ink); }
  .tf-upsell .txt .label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .tf-upsell .txt .name { font-size: 15px; font-weight: 800; }
  .tf-upsell .price { font-size: 13px; font-weight: 800; color: var(--accent); flex-shrink: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/mypage.html" id="backLink">←</a>
    <div class="ttl">오늘의 운세</div>
      <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
    <div id="loadingBox" class="hint">불러오는 중...</div>
    <div id="errorBox" class="error-box hidden"></div>

    <div id="content" class="hidden">
      <div class="card fortune-card">
        <div class="row-top">
          <div class="eyebrow" id="tfDate"></div>
          <span class="fortune-score" id="tfScore"></span>
        </div>
        <h2 id="tfTitle"></h2>
        <ul class="tf-summary-list" id="tfSummary"></ul>
      </div>

      <div class="card">
        <h3>오늘의 운세 날씨</h3>
        <div class="tf-weather">
          <div class="icon" id="tfWeatherIcon"></div>
          <div>
            <div class="label" id="tfWeatherLabel"></div>
            <div class="note" id="tfWeatherNote"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>오늘의 DO & DON'T</h3>
        <div class="tf-dodont">
          <div class="do">
            <div class="col-ttl">DO</div>
            <ul id="tfDos"></ul>
          </div>
          <div class="dont">
            <div class="col-ttl">DON'T</div>
            <ul id="tfDonts"></ul>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>오늘 나의 하루 액땜 퀘스트</h3>
        <p class="hint" style="margin-top:-6px;">오늘 필요한 기운을 채워주는 작은 행동들이에요. 체크해보세요.</p>
        <div id="tfQuest"></div>
      </div>

      <div class="card">
        <h3>이번 주 흐름</h3>
        <div class="tf-week" id="tfWeek"></div>
        <p class="tf-week-best" id="tfWeekBest"></p>
      </div>

      <a class="card tf-upsell" id="tfUpsell" href="#">
        <div class="txt">
          <div class="label" id="tfUpsellLabel"></div>
          <div class="name" id="tfUpsellName"></div>
        </div>
        <div class="price" id="tfUpsellPrice"></div>
      </a>
    </div>
  </main>
</div>

<script>
  // 이 페이지는 홈 화면·마이페이지 두 곳 모두에서 들어올 수 있어서, 뒤로가기 화살표를
  // 마이페이지로 고정해두면 홈에서 들어온 사람은 엉뚱한 곳으로 돌아가게 된다. 같은
  // 사이트에서 온 경우(referrer)엔 실제로 왔던 페이지로 돌려보내고, 새 탭/북마크처럼
  // 이력이 없는 경우에만 마이페이지로 가는 기본 href를 그대로 쓴다.
  document.getElementById('backLink').addEventListener('click', (e) => {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin) {
        e.preventDefault();
        history.back();
      }
    } catch (err) {}
  });

  async function requireLogin() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.user) {
      location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname);
      return null;
    }
    return data.user;
  }

  function questStorageKey(dateStr) {
    return `tf-quest-${dateStr}`;
  }

  function renderQuest(quest, dateStr) {
    const key = questStorageKey(dateStr);
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}

    const box = document.getElementById('tfQuest');
    box.innerHTML = '';
    quest.forEach((item, i) => {
      const row = document.createElement('label');
      row.className = 'tf-quest-item' + (saved[i] ? ' done' : '');
      row.innerHTML = `<input type="checkbox" ${saved[i] ? 'checked' : ''}><span>${item.text}</span>`;
      row.querySelector('input').addEventListener('change', (e) => {
        row.classList.toggle('done', e.target.checked);
        let cur = {};
        try { cur = JSON.parse(localStorage.getItem(key) || '{}'); } catch (err) {}
        cur[i] = e.target.checked;
        try { localStorage.setItem(key, JSON.stringify(cur)); } catch (err) {}
      });
      box.appendChild(row);
    });
  }

  function renderWeek(week, prefix) {
    const box = document.getElementById(prefix + 'Week');
    box.innerHTML = '';
    week.days.forEach((d) => {
      const el = document.createElement('div');
      el.className = 'day' + (d.offset === 0 ? ' today' : '') + (d.offset === week.bestOffset ? ' best' : '');
      el.title = d.date + ' · ' + d.title;
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = Math.max(6, Math.round(d.score * 0.6)) + 'px';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = d.score;
      const wd = document.createElement('span'); wd.className = 'wd'; wd.textContent = d.offset === 0 ? '오늘' : d.weekday;
      el.append(num, bar, wd);
      box.appendChild(el);
    });
    const best = week.days[week.bestOffset];
    const bestEl = document.getElementById(prefix + 'WeekBest');
    bestEl.innerHTML = '';
    if (best.offset === 0) {
      bestEl.append('이번 주에는 ');
      const b = document.createElement('b'); b.textContent = '오늘'; bestEl.append(b);
      bestEl.append('이 가장 좋은 날이에요. 미뤄둔 게 있다면 오늘 움직여보세요.');
    } else {
      bestEl.append('이번 주에는 ');
      const b = document.createElement('b'); b.textContent = `${best.weekday}요일(${best.score}점)`; bestEl.append(b);
      bestEl.append('이 가장 좋아요. 중요한 일정이 있다면 그날로 잡아보세요.');
    }
  }

  function render(fortune, week) {
    document.getElementById('tfDate').textContent = `${fortune.date} · ${fortune.gapja}`;
    document.getElementById('tfScore').textContent = fortune.score + '점';
    document.getElementById('tfTitle').textContent = fortune.title;
    document.getElementById('tfSummary').innerHTML = fortune.summary3.map((s) => `<li>${s}</li>`).join('');

    document.getElementById('tfWeatherIcon').textContent = fortune.weather.icon;
    document.getElementById('tfWeatherLabel').textContent = fortune.weather.label;
    document.getElementById('tfWeatherNote').textContent = fortune.weather.note;

    document.getElementById('tfDos').innerHTML = fortune.dos.map((s) => `<li>${s}</li>`).join('');
    document.getElementById('tfDonts').innerHTML = fortune.donts.map((s) => `<li>${s}</li>`).join('');

    renderQuest(fortune.quest, fortune.date);

    document.getElementById('tfUpsellLabel').textContent = fortune.upsell.label;
    document.getElementById('tfUpsellName').textContent = fortune.upsell.name;
    document.getElementById('tfUpsellPrice').textContent = fortune.upsell.price;
    document.getElementById('tfUpsell').href = fortune.upsell.href;

    if (week) renderWeek(week, 'tf');
    document.getElementById('loadingBox').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  (async () => {
    const user = await requireLogin();
    if (!user) return;
    try {
      const res = await fetch('/api/today-fortune');
      const data = await res.json();
      const loadingBox = document.getElementById('loadingBox');
      const errorBox = document.getElementById('errorBox');
      if (!res.ok) {
        loadingBox.classList.add('hidden');
        errorBox.textContent = data.error || '오늘의 운세를 불러오지 못했어요.';
        errorBox.classList.remove('hidden');
        return;
      }
      render(data.fortune, data.week);
    } catch (err) {
      document.getElementById('loadingBox').classList.add('hidden');
      const errorBox = document.getElementById('errorBox');
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
    }
  })();
</script>
</body>
</html>
