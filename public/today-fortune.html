<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 오늘의 운세</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/reading-ui.css">
<link rel="stylesheet" href="/editorial-refresh.css">
<link rel="stylesheet" href="/fortune-result.css">
<script src="/fortune-result.js"></script>
<style>
  /* 결과 스타일은 fortune-result.css — 무료 체험(today-preview.html)과 같은 파일을 쓴다. */
  .reading-page main { padding-top: 18px; }
</style>
</head>
<body class="reading-page editorial-result-page">
<div class="app">
  <header>
    <a class="back" href="/mypage.html" id="backLink">←</a>
    <div class="ttl">오늘의 운세</div>
      <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
    <div id="loadingBox" class="hint">불러오는 중...</div>
    <div id="errorBox" class="error-box hidden"></div>

    <div id="content" class="fortune-result hidden">
      <section class="fr-cover">
        <p class="fr-date" id="tfDate"></p>
        <h2 class="fr-verdict" id="tfTitle"></h2>
        <div class="fr-score">
          <div class="fr-score-num"><b id="tfScore"></b><span>/ 100</span></div>
          <div class="fr-weather"><b id="tfWeatherLabel"></b><span id="tfWeatherNote"></span></div>
        </div>
        <div class="fr-meter" aria-hidden="true"><i id="tfMeter"></i></div>
        <ul class="fr-summary" id="tfSummary"></ul>
      </section>

      <section class="fr-section">
        <h3 class="fr-h">오늘 이렇게 해보세요</h3>
        <p class="fr-lead" id="tfDesc"></p>
        <div class="fr-actions">
          <div class="do"><h4>하면 좋은 것</h4><ul id="tfDos"></ul></div>
          <div class="dont"><h4>피할 것</h4><ul id="tfDonts"></ul></div>
        </div>
      </section>

      <section class="fr-section">
        <div class="fr-h-row">
          <h3 class="fr-h">앞으로 7일</h3>
          <p class="fr-h-sub" id="tfWeekBest"></p>
        </div>
        <div class="fr-week" id="tfWeek"></div>
      </section>

      <section class="fr-section">
        <div class="fr-h-row">
          <h3 class="fr-h">오늘의 액땜 퀘스트</h3>
          <p class="fr-h-sub">오늘 필요한 기운을 채우는 작은 행동</p>
        </div>
        <div class="fr-quest" id="tfQuest"></div>
      </section>

      <a class="fr-next" id="tfUpsell" href="#">
        <span class="fr-next-kicker">다음 장</span>
        <span class="fr-next-lead" id="tfTopicLead"></span>
        <span class="fr-next-desc">오늘 하루가 아니라 이 흐름 자체를 — 지금 대운과 앞으로 3년, 할 것과 피할 것까지 읽어드려요.</span>
        <span class="fr-next-btn"><span id="tfUpsellName"></span><span class="price" id="tfUpsellPrice"></span></span>
      </a>
    </div>
  </main>
</div>

<script>
  // 이 페이지는 홈 화면·마이페이지 두 곳 모두에서 들어올 수 있어서, 뒤로가기 화살표를
  // 마이페이지로 고정해두면 홈에서 들어온 사람은 엉뚱한 곳으로 돌아가게 된다. 같은
  // 사이트에서 온 경우(referrer)엔 실제로 왔던 페이지로 돌려보내고, 새 탭/북마크처럼
  // 이력이 없는 경우에만 마이페이지로 가는 기본 href를 그대로 쓴다.
  document.getElementById('backLink').addEventListener('click', (e) => {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin) {
        e.preventDefault();
        history.back();
      }
    } catch (err) {}
  });

  async function requireLogin() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.user) {
      location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname);
      return null;
    }
    return data.user;
  }

  function questStorageKey(dateStr) {
    return `tf-quest-${dateStr}`;
  }

  function renderQuest(quest, dateStr) {
    const key = questStorageKey(dateStr);
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}

    const box = document.getElementById('tfQuest');
    box.innerHTML = '';
    quest.forEach((item, i) => {
      const row = document.createElement('label');
      row.className = saved[i] ? 'done' : '';
      row.innerHTML = `<input type="checkbox" ${saved[i] ? 'checked' : ''}><span>${item.text}</span>`;
      row.querySelector('input').addEventListener('change', (e) => {
        row.classList.toggle('done', e.target.checked);
        let cur = {};
        try { cur = JSON.parse(localStorage.getItem(key) || '{}'); } catch (err) {}
        cur[i] = e.target.checked;
        try { localStorage.setItem(key, JSON.stringify(cur)); } catch (err) {}
      });
      box.appendChild(row);
    });
  }

  function render(fortune, week) {
    FortuneResult.render(fortune, week, 'tf');
    renderQuest(fortune.quest, fortune.date);
    document.getElementById('loadingBox').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  (async () => {
    const user = await requireLogin();
    if (!user) return;
    try {
      const res = await fetch('/api/today-fortune');
      const data = await res.json();
      const loadingBox = document.getElementById('loadingBox');
      const errorBox = document.getElementById('errorBox');
      if (!res.ok) {
        loadingBox.classList.add('hidden');
        errorBox.textContent = data.error || '오늘의 운세를 불러오지 못했어요.';
        errorBox.classList.remove('hidden');
        return;
      }
      render(data.fortune, data.week);
    } catch (err) {
      document.getElementById('loadingBox').classList.add('hidden');
      const errorBox = document.getElementById('errorBox');
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
    }
  })();
</script>
</body>
</html>
