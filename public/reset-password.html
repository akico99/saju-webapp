<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주보는 수달 — 비밀번호 재설정</title>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="/login.html">←</a>
    <div class="ttl">비밀번호 재설정</div>
  </header>
  <main>
    <h1 id="pageH1">새 비밀번호를 정해주세요</h1>
    <p class="lead" id="pageLead">8자 이상으로 입력해주세요.</p>

    <div id="errorBox" class="error-box hidden"></div>

    <form id="resetForm">
      <div class="field">
        <label>새 비밀번호</label>
        <input type="password" name="password" required minlength="8">
      </div>
      <div class="field">
        <label>새 비밀번호 확인</label>
        <input type="password" name="passwordConfirm" required minlength="8">
      </div>
      <button type="submit" id="submitBtn">비밀번호 변경하기</button>
    </form>
    <p class="switch-link"><a href="/login.html">로그인으로 돌아가기</a></p>
  </main>
</div>

<script>
  const token = new URLSearchParams(location.search).get('token');
  const form = document.getElementById('resetForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  if (!token) {
    document.getElementById('pageH1').textContent = '링크가 올바르지 않아요';
    document.getElementById('pageLead').textContent = '비밀번호 찾기를 다시 요청해주세요.';
    form.classList.add('hidden');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');

    const fd = new FormData(form);
    const password = fd.get('password');
    const passwordConfirm = fd.get('passwordConfirm');
    if (password !== passwordConfirm) {
      errorBox.textContent = '비밀번호가 서로 달라요. 다시 확인해주세요.';
      errorBox.classList.remove('hidden');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '변경하는 중...';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || '변경 실패';
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = '비밀번호 변경하기';
        return;
      }
      alert('비밀번호가 변경됐어요. 새 비밀번호로 로그인해주세요.');
      location.href = '/login.html';
    } catch (err) {
      errorBox.textContent = '요청 실패: ' + err.message;
      errorBox.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = '비밀번호 변경하기';
    }
  });
</script>
</body>
</html>
