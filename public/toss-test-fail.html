<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>사주보는 수달 — 결제 실패(테스트)</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .test-badge { display: inline-block; font-size: 11px; font-weight: 800; color: var(--danger); background: var(--danger-soft); padding: 4px 10px; border-radius: var(--radius-pill); margin-bottom: 14px; }
</style>
</head>
<body>
<div class="app no-nav">
  <header>
    <a class="back" href="/">←</a>
    <div class="ttl">결제 실패</div>
    <a class="home-link" href="/" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg></a>
  </header>
  <main>
    <span class="test-badge">TEST MODE · 실제 결제 아님</span>
    <h1>결제가 완료되지 않았어요</h1>
    <p class="lead" id="desc">-</p>
    <div class="point-notice" id="codeBox"></div>
    <a href="/toss-test-checkout.html" class="download-btn" style="margin-top:20px;display:inline-block;">다시 시도하기</a>
  </main>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('desc').textContent = params.get('message') || '결제가 취소되었거나 실패했어요.';
  document.getElementById('codeBox').textContent = '에러 코드: ' + (params.get('code') || '-');
</script>
</body>
</html>
